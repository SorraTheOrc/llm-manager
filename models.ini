# models.ini — Single source of truth for model configuration.
#
# Quantization (from hf-repo suffix after ":") and ctx-size defined here
# are used by both router-mode and single-model startup (start-llama.sh).
# Start-llama.sh will override hardcoded defaults with these values.
#
# Format for hf-repo:
#   hf-repo = <org>/<model-name>:<quantization>
# The quantization suffix (e.g., Q5_K_M, Q8_0) is parsed automatically.

# Global defaults. NOTE: llama.cpp's router only honours `[*]` sections as
# the global preset (common/preset.cpp load_from_ini); a `[global]` section is
# parsed as a *model named "global"* and its keys are never cascaded to other
# models (LP-0MSAZXXDY005AWA1). Keep per-model keys in each model's own section.
[global]
ngl = 80
slot-save-path = /home/rgardler/projects/llm/slot-cache

[mxbai-embed]
hf-repo = magicunicorn/mxbai-embed-large-v1-Q8_0-GGUF:Q8_0
embeddings = true
pooling = mean

[Qwen3]
hf-repo = unsloth/Qwen3.6-35B-A3B-GGUF:Q5_K_M
ctx-size = 131072
# Base ctx-size used at boot and in fast mode (3 slots). The model's true
# max is 262144 (GGUF qwen35moe.context_length); cheap mode reaches it via
# the per-period ctx_size override in config-cheap.yaml's slot_schedule
# (LP-0MSMZOAJW002UR2A). Do not raise this base to 262144 without pinning
# fast's slot_schedule entries: fast would then boot at the rejected
# 3x87.4K per-slot config (LP-0MSAOQTJS000FFVM / LP-0MSEGPO77005CYCQ).
# ctx-size eval (LP-0MSAOQTJS000FFVM F6): larger per-slot ctx (4x65.5K /
# 3x87.4K / 2x131K) is NOT recommended - concurrency is the binding
# constraint (see docs/llama-router.md + follow-up LP-0MSEGPO77005CYCQ).
# Option C (3x43.7K = 131072/3) restored per LP-0MSEGPO77005CYCQ F4; the
# live config had drifted to the rejected 4x65.5K (262144/4) via ccca402.
flash-attn = true
swa-full = true
no-mmproj = true
# KV-cache quantization (LP-0MSDCLQ2W001LGWC): halves the f16 KV read
# cost per decoded token (Q8_0) for large-context sessions, speeding up
# decode ~1.2-1.4x. q8_0 is a good default; q4_0 saves more VRAM at a
# small quality cost. Values must be lowercase (llama.cpp allowed set:
# f32, f16, bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1).
cache-type-k = q8_0
cache-type-v = q8_0

[Qwen3-MTP]
# MTP (Multi-Token Prediction) evaluation preset (LP-0MSNI1B68001VE6C).
# Uses the MTP-converted GGUF whose built-in prediction heads enable
# speculative drafting via llama-server --spec-type draft-mtp
# --spec-draft-n-max 2 (llama.cpp PR #22673). Coexists with [Qwen3];
# production chains are unaffected until rollout is approved.
#
# MTP requires single-slot serving (--parallel 1). Serving this preset
# also requires an MTP-capable llama-server build (post-2026-05-16 master;
# build b8782/e97492369 predates the MTP merge and does NOT support
# draft-mtp). Per-model spec flags through the router preset are verified
# during the benchmark phase once such a build is deployed
# (scripts/rebuild-llama.sh).
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_S
ctx-size = 131072
flash-attn = true
swa-full = true
no-mmproj = true
cache-type-k = q8_0
cache-type-v = q8_0

[Qwen3-Coder-Next]
# Qwen3 Coder Next GGUF from official Qwen HF repo.
# Separate model from the unsloth-based Qwen3-Next preset.
# Preserved by cleanup scripts.
hf-repo = Qwen/Qwen3-Coder-Next-GGUF:Q5_K_M
ctx-size = 262144
flash-attn = true
jinja = true

[gemma4]
hf-repo = ggml-org/gemma-4-31B-it-GGUF:Q5_K_M
ctx-size = 262144
jinja = true

[gpt120]
hf-repo = Unsloth/gpt-oss-120b-GGUF:Q5_K_M
ctx-size = 131072
