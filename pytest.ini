[pytest]
# Single pytest configuration for the whole repository (LP-0MVZ43UR8004IL8Y).
#
# This file exists so every invocation resolves ``rootdir`` to the repository root,
# including the changed-scope selection that mixes ``proxy/`` tests with
# ``.pi/skills/proxy-usage-analysis/tests`` in one process. While ``proxy/pytest.ini``
# was the only configuration file in the tree, pytest adopted it for the whole session
# and resolved ``rootdir`` to ``<repo>/proxy``; test modules outside that root then lost
# the file component of their node ids (``::Class::test``), so module-level autouse
# fixtures leaked into unrelated modules and three GPU-busy tests failed.
#
# Marker registry: these markers are used by the ``proxy/`` suite. Keep the list in one
# place — this file — so a mixed run and a proxy-only run register the same markers.

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    refactor_parity: contract tests that guard behavior during proxy server refactor slices
    integration: tests that exercise component integration boundaries
    live: on-demand live verification tests against a running proxy/llama-server (env-guarded, e.g. RUN_LIVE_SLOTS_VERIFY=1)
    e2e_live: on-demand end-to-end tests against a live local proxy server (set RUN_LIVE_PROXY_E2E=1 to run)
    tts_integration: TTS integration tests requiring a running tts-server (set RUN_LIVE_TTS=1 to run)
    live_port_kill: on-demand tests that spawn and kill real OS processes (LIVE_PORT_KILL_TESTS=1 to run)
