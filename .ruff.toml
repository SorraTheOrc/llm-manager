target-version = "py312"
line-length = 120

# Exclude non-Python files (YAML configs, bash scripts, etc.) — ruff treats
# them as Python and reports false-positive "invalid-syntax" errors.
# Per-file-ignores cannot suppress invalid-syntax parse errors.
exclude = ["*.yaml", "*.yml", "start-llama.sh", "scripts/rebuild-and-restart-mtp.sh", "scripts/rebuild-llama.sh"]

[lint]
select = [
    "F",      # Pyflakes (logic errors)
    "E",      # Pycodestyle (errors)
    "W",      # Pycodestyle (warnings)
    "I",      # isort (import sorting)
    "N",      # PEP 8 naming conventions
    "UP",     # pyupgrade (modern Python)
    "RUF100", # Ruff-specific: detect unused noqa directives
]

ignore = [
    "E501",   # Line length is advisory; project uses 120 chars
]

# Test-specific overrides
# Permit assert (S101), print (T201), and unused imports in test files
per-file-ignores = { "tests/*" = ["S101", "T201", "F401"], "proxy/tests/*" = ["S101", "T201", "F401"] }
