[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    refactor_parity: contract tests that guard behavior during proxy server refactor slices
    integration: tests that exercise component integration boundaries
    live: on-demand live verification tests against a running proxy/llama-server (env-guarded, e.g. RUN_LIVE_SLOTS_VERIFY=1)
    e2e_live: on-demand end-to-end tests against a live local proxy server (set RUN_LIVE_PROXY_E2E=1 to run)
    tts_integration: TTS integration tests requiring a running tts-server (set RUN_LIVE_TTS=1 to run)
    live_port_kill: on-demand tests that spawn and kill real OS processes (set LIVE_PORT_KILL_TESTS=1 to run)
