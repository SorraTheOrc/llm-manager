# ---------------------------------------------------------------------------
# FAST MODE OVERLAY (config-fast.yaml)
# ---------------------------------------------------------------------------
# This file is an OVERLAY, not a standalone config. `load_config()`
# (proxy/proxy/utils.py -> proxy.config_merge.deep_merge) deep-merges it on
# top of the authoritative base config `config.yaml`:
#   * nested mappings merge recursively,
#   * every other value (scalar, list, null) replaces the base value wholesale,
#     so lists are never merged element-wise.
#
# Only values that genuinely differ from `config.yaml` are declared here.
# Everything else -- `logging`, `providers`, `default_model`, `audit_model`,
# `audit_model_fallbacks`, `session_recording` and all other `server` keys --
# is inherited from `config.yaml`.
#
# Intentionally overridden:
#   * models.plan / models.author / models.code / models.compact
#       Provider lists are retained in full (a list replaces the base list
#       wholesale) because fast mode leaves the opencode-hosted deepseek
#       providers untimed: the `available_times` windows present in
#       `config.yaml` are intentionally omitted.
#   * server.contention_queue_policy / contention_queue_max_wait_seconds /
#     contention_queue_max_depth
#       Smaller queue (depth 3, 45s) than cheap mode, so bursts spill to
#       remote providers sooner during peak hours.
#   * server.mode_switch_drain.max_seconds  (30; base 90)
#   * server.upstream_idle_timeout_seconds  (240; base 30)
#
# Deleting this file makes `mode_config_file()` fall back to `config.yaml`,
# i.e. the fast profile degrades to the base profile.
#
# Inherited large-context thresholds (LP-0MU466L1X003RTHN): fast runs 1 slot x
# 262144 ctx. The warm threshold is auto-derived as
#   min(physical 262144//1 - 4096 = 258048,
#       economic min(round(0.3815 x 262144), 100000) = 100000) = 100000
# and cold stays the fixed economic 38000, so the (38000, 100000] band is
# non-empty. No manual recalculation is needed when the slot count or model
# context size changes.
# ---------------------------------------------------------------------------

models:
  plan:
    providers:
      - name: local-qwen3
        type: local
        llama_model: Qwen3
      - name: opencode-go-3
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_3_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go-2
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_2_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: deepseek-flash
        type: remote
        provider: deepseek
        endpoint: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-flash
  author:
    providers:
      - name: local-qwen3
        type: local
        llama_model: Qwen3
      - name: opencode-go-3
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_3_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go-2
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_2_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: deepseek-flash
        type: remote
        provider: deepseek
        endpoint: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-flash
  code:
    providers:
      - name: local-qwen3
        type: local
        llama_model: Qwen3
      - name: opencode-go-3
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_3_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go-2
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_2_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: opencode-go
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_API_KEY
        forward_session_headers: false
        model: deepseek-v4.1-flash
      - name: deepseek-flash
        type: remote
        provider: deepseek
        endpoint: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-flash
  compact:
    providers:
      - name: opencode-go-compact
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_API_KEY
        model: muse-spark-1.3-contributor
        api: openai-responses
        forward_session_headers: false
      - name: deepseek-flash-compact
        type: remote
        provider: deepseek
        endpoint: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-flash
server:
  contention_queue_policy: queue
  contention_queue_max_wait_seconds: 45
  contention_queue_max_depth: 3
  mode_switch_drain:
    max_seconds: 30
  upstream_idle_timeout_seconds: 240
