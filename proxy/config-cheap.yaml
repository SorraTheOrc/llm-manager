# ---------------------------------------------------------------------------
# CHEAP MODE OVERLAY (config-cheap.yaml)
# ---------------------------------------------------------------------------
# This file is an OVERLAY, not a standalone config. `load_config()`
# (proxy/proxy/utils.py -> proxy.config_merge.deep_merge) deep-merges it on
# top of the authoritative base config `config.yaml`:
#   * nested mappings merge recursively,
#   * every other value (scalar, list, null) replaces the base value wholesale,
#     so lists are never merged element-wise.
#
# Only values that genuinely differ from `config.yaml` are declared here.
# Everything else -- `models` (cheap uses the same models/provider chains as
# the base, remote providers included), `logging`, `providers`,
# `default_model`, `audit_model`, `audit_model_fallbacks`,
# `session_recording` -- is inherited from `config.yaml`.
#
# Intentionally overridden (all under `server`):
#   * session_slot_pool_size: 3            (base 1)  -- three GPU slots
#   * contention_queue_policy: queue       (base absent)
#   * contention_queue_max_wait_seconds: 120
#   * contention_queue_max_depth: 8
#   * local_large_context_cold_cache_threshold: 42000  (base 38000)
#   * local_large_context_economic_bypass_serves_local: true  (base absent)
#   * mode_switch_drain.max_seconds: 30    (base 90)
#   * upstream_idle_timeout_seconds: 240   (base 30)
#
# Deleting this file makes `mode_config_file()` fall back to `config.yaml`,
# i.e. the cheap profile degrades to the base profile.
# ---------------------------------------------------------------------------

server:
  local_large_context_cold_cache_threshold: 42000
  local_large_context_economic_bypass_serves_local: true
  session_slot_pool_size: 3
  contention_queue_policy: queue
  contention_queue_max_wait_seconds: 120
  contention_queue_max_depth: 8
  mode_switch_drain:
    max_seconds: 30
  upstream_idle_timeout_seconds: 240
