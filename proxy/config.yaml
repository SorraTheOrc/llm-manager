server:
  embeddings_model: mxbai-embed
  host: 0.0.0.0
  # Close idle keep-alive sockets and bound graceful-shutdown drain to
  # prevent CLOSE-WAIT socket accumulation from abandoned connections
  # (LP-0MSNM9UCC002CHYU).
  timeout_keep_alive: 5
  timeout_graceful_shutdown: 30
  # Fallback to host start is not permitted in production. This flag is
  # reserved for temporary developer troubleshooting only and must not be
  # committed in infra-managed production deployments.
  # For this environment we allow host-start so the proxy can spawn the
  # podman-backed container via the host start script wrapper.
  llama_allow_host_fallback: true
  llama_embed_load_timeout: 30
  # Router model-health monitoring cadence (seconds).
  # Preferred key (used by backend health loop):
  llama_model_health_interval_seconds: 10
  # Legacy alias retained for compatibility with older configs.
  llama_health_check_interval: 10
  # Reduce false-positive unload/reload churn under transient probe failures.
  llama_model_health_failures_before_recovery: 2
  llama_model_health_probe_attempts: 2
  llama_model_health_probe_timeout_seconds: 5
  llama_model_health_probe_backoff_seconds: 0.5
  llama_model_health_grace_period_seconds: 15
  # --- GPU-wedge self-healing (LP-0MS91DHQ9003EGB0) ---
  # A wedged llama-server is still HTTP-reachable but its GPU kernels never
  # complete (GPU ~100% busy with all slots idle, no tokens produced). The
  # model-health loop detects this signature and unloads/reloads the model.
  # Detection reads gpu_busy_percent from sysfs (AMD) with a rocm-smi
  # fallback; when neither is available detection is skipped.
  #
  # DISABLED BY DEFAULT (LP-0MS9GA6QL007XTBP): on this Strix Halo APU
  # (Radeon 8060S iGPU, gfx1151) gpu_busy_percent is pinned at 100% regardless
  # of actual GPU state (30/30 samples read 100 while power draw showed the
  # GPU idle at ~54W vs ~115W when computing). The busy+idle signature
  # therefore false-positives on every idle period, causing constant
  # unload/reload churn (144 unloads in one day, killing in-flight requests).
  # On this hardware class a wedged engine (LP-0MS91D782006XIR6, ~53W idle
  # power) is indistinguishable from normal idle from GPU sensors, so the
  # busy counter cannot be trusted. Enable only on hardware with a reliable
  # busy counter; the power-draw discriminator below reduces false positives
  # and auto-disables detection when the counter is found pinned.
  llama_gpu_wedge_detection_enabled: false
  # GPU busy % at or above which the GPU is considered busy.
  llama_gpu_wedge_busy_threshold_percent: 90
  # Consecutive health-loop checks with the wedge signature before recovery.
  # With the default 10s interval, 2 checks bounds detection to ~20-30s.
  llama_gpu_wedge_idle_checks_required: 2
  # Power draw (W) below which the GPU is considered NOT genuinely computing.
  # busy>=threshold + idle slots + power below this = pinned/unreliable busy
  # counter (or stalled engine) -> never unloads; detection auto-disables if
  # this state persists for llama_gpu_wedge_pinned_checks_required checks.
  llama_gpu_wedge_power_low_threshold_watts: 90
  # Consecutive pinned-counter observations (busy high + idle + low power)
  # before GPU-wedge detection is disabled for the process lifetime.
  llama_gpu_wedge_pinned_checks_required: 4
  llama_model_load_timeout: 600
  llama_models_max: 2
  llama_request_timeout: 1500
  # Provider fallback cooldown: seconds to wait before retrying a failed provider
  provider_cooldown_seconds: 60

  # Upstream x-ratelimit-* honouring (LP-0MVBHDNLB007ALLJ). When enabled, an
  # HTTP 429 whose response carries `x-ratelimit-reset-*` headers sets the
  # provider cooldown to at least the upstream-reported reset (plus
  # ratelimit_cooldown_margin_seconds) instead of a blind exponential-backoff
  # guess, so the proxy stops probing an endpoint that is guaranteed to reject
  # during a rate-limit exhaustion window. Enable per provider entry with
  # `respect_ratelimit_headers: true` (the entry flag wins), or globally here.
  # On a quota 429 (per-account rate_limit_error / rate_limit_exceeded, or
  # `x-ratelimit-over-limit`) the parsed reset is ALSO applied as an
  # account-scoped quarantine of reset + the 2-minute usage-limit margin
  # (_USAGE_LIMIT_RESET_MARGIN_SECONDS), keyed on api_key_env@endpoint:model
  # so same-gateway paid siblings stay eligible (LP-0MVFA1VRT007T9HT). Two
  # margins, never interchangeable: 2 s for the entry cooldown above,
  # 2 minutes for the account quarantine.
  # Default false: every provider keeps its existing behaviour.
  respect_ratelimit_headers: false
  # Safety margin added to a header-derived cooldown so it never expires
  # exactly on the upstream boundary (default 2 seconds).
  ratelimit_cooldown_margin_seconds: 2

  # Free-tier request budget (LP-0MVDQ1GMO00801PL).
  # A provider entry that declares `rate_limit_rpm` (e.g. `munitoai-free`) is
  # dispatched to at most that many times in any rolling 60s window. When the
  # window is full:
  #   - a NEW session (no affinity record for the entry) skips the entry
  #     immediately and continues down the fallback chain — it is never parked,
  #     so waiting requests cannot compound the contention;
  #   - a session already served by the entry (affinity recorded on a 2xx
  #     dispatch) waits for the window to reset, keeping the same upstream
  #     provider and its prompt cache/prefix continuity.
  # The wait is bounded by the remaining window and
  # provider_rate_limit_wait_max_seconds, depth-capped so waiters cannot pile
  # up, and aborted as soon as the client disconnects.
  #   - provider_rate_limit_reserve_ratio: fraction of the window held back for
  #     in-progress sessions (default 0.3). New sessions may consume at most
  #     `rate_limit_rpm - reserve` slots; sessions that already use the entry
  #     may consume the whole window. Without a reserve, established sessions
  #     queue behind new-session traffic and wait 15-55s per turn, which
  #     dominated first-token latency (p99 21s -> 53s, LP-0MVDUN5CY009VD20).
  #     Clamped to [0, 1] and to `rate_limit_rpm - 1`, so new sessions are
  #     never locked out; 0 disables the reserve.
  #   - provider_rate_limit_wait_max_seconds: max wait for an in-progress
  #     session (default 15; 0 disables waiting entirely -> always pass through).
  #     Lowered from 60 (LP-0MVDUN5CY009VD20): waits of 30-60s caused ~50% of the
  #     observed first-token latency regression.
  #   - provider_rate_limit_wait_max_waiters: max concurrent waiters across all
  #     gated entries (default 8; 0 denies every wait).
  #   - provider_affinity_ttl_seconds: how long a session counts as "in
  #     progress" on a gated entry (default 900 = 15 min; 0 disables affinity,
  #     so every request is treated as new).
  # These four are the GLOBAL defaults — a `models.<name>.budget` block, or a
  # provider entry's own `budget` block, overrides any of them per chain/entry
  # (precedence: entry > model > server > default, LP-0MVDVK5TM004TQQV;
  # see the header comment for the full example). The budget bucket itself
  # stays per provider entry, shared by every model that routes through it.
  provider_rate_limit_reserve_ratio: 0.3
  provider_rate_limit_wait_max_seconds: 15
  provider_rate_limit_wait_max_waiters: 8
  provider_affinity_ttl_seconds: 900
  # Proactive OpenCode Go quota poller (LP-0MVF7KEG7007C8MF).
  # The proxy polls GET {endpoint}/v1/usage per distinct `opencode-*`
  # api_key_env on this interval and caches the derived per-account quota
  # state (rolling/weekly/monthly headroom, effective headroom, seconds to
  # reset, exhausted). Polls are interval-gated and single-flighted per
  # account; a poll failure keeps the last known values, logs at WARN and
  # never delays a client request. Full documentation lands with the
  # quota-surge design doc (LP-0MVF7KRH30000KOA).
  # Default: 900 seconds (15 minutes).
  quota_poll_interval_seconds: 900
  # Optional quota-surge account allow-list. Each item is either a provider
  # entry name (e.g. `opencode-go-3`) or an `api_key_env`
  # (e.g. `OPENCODE_3_API_KEY`). When omitted, all `opencode-*` entries are
  # managed. A comma-separated string is also accepted.
  # quota_surge_accounts:
  #   - opencode-go
  #   - opencode-go-3
  # Quota-surge pacing model (LP-0MVF7KHI5000J7BL, pure functions in
  # proxy/quota_pacing.py). OpenCode Go allowances are use-it-or-lose-it, so
  # during the final week before an account's own `resetsAt` the proxy may
  # surge traffic to it. The window and ramp are computed per account from its
  # own reset date (reset dates are not calendar-aligned).
  #   - quota_surge_days: length of the final surge window in days. An entry
  #     with `0 < seconds_to_reset <= quota_surge_days * 86400` is inside the
  #     window. 0 disables the window. Default: 7.
  #     Inside this window the entry's `available_times` restriction is also
  #     lifted for that account (LP-0MVF7KJN2000ASE8): the residual allowance
  #     may be spent at any UTC hour, logged once per state change with
  #     `reason=quota_surge`. Only `available_times` is bypassed — cooldown,
  #     `rate_limit_rpm`, the sibling-failure circuit breaker, failure-domain
  #     grouping, usage-limit quarantine and stall gates still apply. The
  #     bypass clears when the account is exhausted or its reset passes.
  #   - quota_pacing_target: fraction of the residual allowance the ramp aims
  #     to spend by `resetsAt` (0.95 = finish at ~95%, leaving a 5% margin for
  #     the rolling/weekly caps). Values outside (0, 1] are clamped, not
  #     trusted. Default: 0.95.
  # The ramp also starts BEFORE the final week when the residual cannot be
  # discharged in time: the documented Go caps (rolling 5-hour window = 20% of
  # monthly, weekly window = 50% of monthly) bound the achievable spend rate,
  # so e.g. 90% left with 2 days to reset must already be ramping.
  quota_surge_days: 7
  quota_pacing_target: 0.95
  # Quota-surge kill switch, dry run and stale-state fail-safe
  # (LP-0MVF7KPB9009U7CG). All three flags are consulted per request through
  # the single predicate `quota_state.quota_behaviour()`, which every quota
  # decision site (ordering, `available_times` bypass, quota-driven skip)
  # shares:
  #   - quota_surge_enabled: false turns every quota-derived decision off. No
  #     ordering, no bypass, no quota-driven skip: routing is byte-identical
  #     to the configuration without quota state. The separate cost guard
  #     (`quota_exhaustion_percent`) is a money guard and stays active. The
  #     poller keeps running so state and observability stay current.
  #     Default: true.
  #   - quota_surge_dry_run: true computes and logs the decisions it *would*
  #     take (INFO lines with `reason=quota_surge_dry_run`, DEBUG
  #     `quota_ordering` lines with `applied=False`) but leaves the selected
  #     provider, eligibility, `retry_after` and next-window values unchanged.
  #     The flag is re-read per request (no cached decision). Default: false.
  #   - quota_state_max_age_seconds: fail-safe stale guard. When the last
  #     successful poll for an account is older than this, surge is
  #     SUSPENDED for that account: no bypass, no quota-driven re-ordering or
  #     skip, so routing reverts to the configured `available_times` and config
  #     order. One WARN per account per suspension with
  #     `reason=quota_surge_suspended`, and one INFO on recovery. Missing /
  #     never-polled state never suspends (nothing is stale) and never enables
  #     surge. Default: 3600 seconds (1 hour).
  quota_surge_enabled: true
  quota_surge_dry_run: false
  quota_state_max_age_seconds: 3600
  # Quota hard stop / cost guard (LP-0MVF7KO8C005NB59). An `opencode-*` account
  # whose monthly consumption is at or above this percentage — or whose
  # `effective_headroom` is at or below `100 - threshold` (a spent rolling or
  # weekly window) — is skipped before any upstream request is attempted and
  # logged at INFO with `reason=quota_exhausted`. The skip applies whether or
  # not surge is active (surge can never re-enable an exhausted account) and
  # is cumulative with the reactive usage-limit quarantine: it never clears,
  # shortens or overrides it. This is the guard that prevents spending real
  # pay-as-you-go money on an account with the console "Use balance" option
  # enabled. Values outside [1, 100] are clamped and non-numeric values fall
  # back to the default, with one WARN per process.
  # Default: 99.5.
  quota_exhaustion_percent: 99.5
  # Sibling-fallback circuit breaker (LP-0MTPMF03P0046MFG): when a remote
  # provider repeatedly returns an EMPTY response / stalls (no usable content)
  # across retry cycles, the provider is quarantined for an EXTENDED cooldown
  # so the fallback chain permanently skips it and routes to the next healthy
  # sibling instead of retrying the same dead provider ~80x (the 2026-09-06
  # RCA storm: opencode-go returned empty_response 80 times in 32 minutes).
  #   - sibling_fallback_threshold: consecutive empty/stall failures on the
  #     SAME provider entry (e.g. `opencode-go`) within the sliding window that
  #     trigger the extended cooldown. 2 = quarantine after 2 failures.
  #   - sibling_fallback_cooldown_seconds: extended cooldown applied to the
  #     provider (entry AND its shared brand, so same-gateway API-key siblings
  #     opencode-go-2/-3 are skipped too). Longer than the 60s Tier-2 provider
  #     cooldown so cross-request retry cycles stop hammering the dead gateway.
  #   - sibling_fallback_window_seconds: sliding window for the consecutive-
  #     failure streak; a streak with no failures for longer than this resets.
  # 429/402 responses are NOT counted here (they use the existing per-model
  # cooldown); this breaker only covers empty_response / stall_* / zero-content
  # stream errors. State is in-memory (no persistence), like the other
  # cooldown mechanisms.
  sibling_fallback_threshold: 2
  sibling_fallback_cooldown_seconds: 300
  sibling_fallback_window_seconds: 600
  # Chain-hold retry (LP-0MSH94Z7K007VKC9): when EVERY provider in a model's
  # fallback chain is exhausted, hold the request for chain_hold_seconds
  # (default 300) instead of erroring immediately, then start a NEW cycle from
  # the FIRST provider — giving short cooldowns (60s provider cooldown, 180s
  # stall circuit breaker, available_times window edges) time to expire.
  #   - The hold is BOUNDED by the exhaustion response's real ``retry_after``
  #     (LP-0MU56ZKQD005SX08): each hold waits at most the sooner of
  #     chain_hold_seconds and retry_after; when retry_after exceeds the total
  #     budget (chain_hold_seconds x chain_hold_max_cycles) the terminal 503
  #     is returned immediately with its accurate Retry-After instead of
  #     holding through cycles that cannot succeed.
  #   - Free-tier budget-window exhaustion advertises the WINDOW ROLLOVER as
  #     its ``retry_after`` (LP-0MVF0N9SA0071LWM): a ``rate_limit_rpm`` budget
  #     skip records no cooldown and no usage-limit reset, so the exhaustion
  #     used to advertise 0 and every hold cycle replayed instantly inside the
  #     still-full window. The derived wait (<= the 60 s window) is bounded by
  #     these chain-hold budgets, so one hold is typically enough for the
  #     window to roll over. Exhaustions with a real cooldown/reset, and
  #     instant-recovery (genuinely 0 s) exhaustions, are unchanged.
  #   - Each hold cycle re-runs the full chain, including local routing and
  #     compaction evaluation; every routing/compaction/hold log line carries
  #     ``chain_hold_cycle=N`` so re-emissions are not read as new demand
  #     (LP-0MU5AIAAY003KVM0).
  #   - Streaming requests receive periodic SSE feedback comments
  #     (`: chain exhausted (...); retrying from <first> in <Ns>`) so clients
  #     can surface live progress (companion item SA-0MSHAKSEA001LQ6T).
  #   - Non-streaming requests are held silently (deferred response).
  #   - A client disconnect aborts the hold promptly.
  #   - 0 disables the wait (retries immediately).
  chain_hold_seconds: 300
  # Maximum number of hold-retry cycles before returning the exhaustion error
  # response unchanged. 0 = infinite (keep holding/retrying until the client
  # disconnects).
  chain_hold_max_cycles: 3
  # Cumulative budget (seconds) for ALL chain-hold waits across cycles, so
  # chain_hold_seconds x chain_hold_max_cycles can never hold a request up to
  # (or past) the client's 900-second queue-timeout deadline — 300 s x 3 = 900 s
  # raced the client exactly (LP-0MU1S617L002Q9PR AC1). Default 720 s leaves a
  # 180 s margin below the 900 s deadline; the proxy always responds before the
  # client gives up. 0 disables the cap (legacy cycle-bounded behaviour).
  # Values >= 900 are rejected at load as they recreate the exact race.
  chain_hold_total_seconds: 720
  # Client-facing cap (seconds) on the advertised exhaustion retry timer —
  # the JSON ``retry_after`` field and the matching ``Retry-After`` header on
  # both exhaustion 503 variants (``all_exhausted`` /
  # ``outside_time_window``) (LP-0MV0MM5R60025XZE). The honest computed wait
  # can be many hours away (the next ``available_times`` window edge or a
  # usage-limit reset); advertising that verbatim parks an unattended client
  # far longer than capacity routinely takes to return. Waits at or below the
  # cap are advertised unchanged; waits above it are clamped to the cap. This
  # bounds the ADVERTISEMENT only — the true reset stays visible in
  # ``diagnostics``/``unavailable_providers`` and provider schedules,
  # cooldowns and quarantine durations are untouched. A missing, malformed or
  # non-positive value falls back to the default 3600 so the cap is never
  # accidentally disabled.
  max_retry_after_seconds: 3600
  # Local slot-exhaustion grace retries before remote fallback.
  # Helps right-after-restart races where slot probes briefly report 0 available.
  local_slot_exhaustion_retry_attempts: 2
  local_slot_exhaustion_retry_delay_seconds: 0.1
  # Adaptive timeout: base + per_token * prompt_tokens
  llama_adaptive_timeout_enabled: true
  llama_adaptive_timeout_base_seconds: 60
  llama_adaptive_timeout_per_token_seconds: 0.015
  # Remote-specific adaptive timeout overrides (optional).
  # When set, these values are used instead of the local adaptive timeout
  # parameters for remote provider requests. Remote providers may have
  # different latency characteristics requiring shorter timeouts.
  # Falls back to the local values above when not configured.
  llama_remote_request_timeout_base_seconds: 60
  llama_remote_request_timeout_per_token_seconds: 0.015
  # Large-context cold-cache fallback threshold (LP-0MRCSSBTM002NK3B).
  # When the slot cache is cold (invalidated) and estimated prompt tokens exceed
  # this value, local routing is bypassed and the request falls through to the
  # next remote provider immediately. Set to 0 to disable.
  #
  # This is an ECONOMIC new-token threshold, not a physical capacity limit. It
  # defines the lower edge of the (cold, warm] band where the cached_ratio
  # routing check operates (new_tokens = estimated * (1 - ratio) > cold).
  # It must stay BELOW the effective warm threshold (per-slot context cap,
  # see LP-0MSAZXXDY005AWA1) or the band collapses to zero width and the
  # ratio check becomes unreachable dead code (LP-0MSI2M5BT004BCDP).
  #
  # CAVEAT (ctx-size eval F2/F3, LP-0MSAOQTJS000FFVM): prompt token estimates
  # use tiktoken (cl100k), which undercounts Qwen3-native tokens ~1.69x for
  # dense prose. A prompt can pass this clamp yet exceed the KV slot at decode
  # time -> llama-server HTTP 400 -> remote fallback. See docs/llama-router.md
  # and follow-up LP-0MSEGPO77005CYCQ (token_estimate_multiplier / native
  # tokenizer).
  #
  # MODE-AWARE value (LP-0MSOMVOPH004ATAK): this default profile mirrors the
  # fast-mode profile (1 slot x 262144; LP-0MU03AL730000B5W; slot count
  # superseded per LP-0MSY0SDAS0031Y7F); keep it aligned with
  # config-fast.yaml (38000). See the mode-aware note there.
  local_large_context_cold_cache_threshold: 38000

  # Context-too-large bypass threshold (skip reason `context_too_large`;
  # LP-0MRE4NBQ5009V5BX, renamed from `warm_cache_bypass` in
  # LP-0MSF8XDG7000PERM). When the estimated prompt context exceeds this
  # value, local routing is bypassed regardless of cache state (the old name
  # was a misnomer: this is a context-size cap, not a cache-warmth signal).
  # Set to 0 to disable. Default: 60000.
  #
  # This is the WARM (total-context) upper bound. The effective warm
  # threshold is resolved through the 3-term model (LP-0MU466L1X003RTHN):
  #   effective_warm = min(physical per-slot clamp, economic ceiling)
  #     physical = local_model_ctx_size // slots - 4096 (output headroom)
  #     economic = round(local_large_context_economic_ceiling_ratio
  #                      x local_model_ctx_size), capped by this value
  # The physical term is a hard capacity limit (LP-0MSAZXXDY005AWA1) so
  # prompts that cannot fit the KV slot are never routed local. The economic
  # term is the latency/utilisation limit. Only WARM is clamped/capped; COLD
  # is the economic new-token threshold and is left unchanged so the
  # (cold, warm] band stays non-empty (LP-0MSI2M5BT004BCDP).
  #
  # CO-CHANGE (LP-0MVHSET0A008VU95): this value is only an UPPER BOUND on the
  # economic ceiling (`round(ratio x local_model_ctx_size)`), so setting it
  # above that ceiling leaves it unused and the effective warm cap unmoved.
  # Raising it therefore REQUIRES raising
  # local_large_context_economic_ceiling_ratio alongside it; startup now
  # reports a config-consistency WARNING when the ceiling shadows this value
  # (validate_local_routing_config).
  #
  # 120000 (was 100000, LP-0MVHSET0A008VU95): the 2026-10-20/21 proxy-usage
  # report showed local busy only 21.4% of the window while 44.4% of routing
  # decisions (~2,462) were skipped as context_too_large, i.e. a context cap
  # problem, not a capacity one. Resolves to 120000 at 1-2 slots (physical
  # clamp 258048 / 126976) and is still bounded by the 83285 physical clamp
  # at 3 slots.
  local_large_context_warm_cache_threshold: 120000

  # Latency-derived economic-ceiling ratio for the WARM threshold
  # (LP-0MU466L1X003RTHN). The ceiling scales linearly with the model context
  # size (not the slot count) so a profile change (smaller model, different
  # slot count) needs no manual threshold recalculation. Shipped 0.4578 =
  # 120000 / 262144 (was 0.3815 = 100000/262144, LP-0MVHSET0A008VU95), which
  # keeps the ~37 tok/s @100K prefill floor as the reference point while
  # letting the ceiling reach the configured 120K warm cap: warm contexts are
  # capped at ~30-46% of the model context. 0 falls back to the absolute
  # local_large_context_warm_cache_threshold; both 0 disables the warm cap.
  # This ratio and the absolute warm value are a CO-CHANGE — raising the
  # absolute alone is a silent no-op (LP-0MVHSET0A008VU95).
  local_large_context_economic_ceiling_ratio: 0.4578

  # `local_hard_routing_cap_ratio_fast` RETIRED (LP-0MTVXP7DG00613ZB AC3):
  # the single `compaction_trigger_ratio` below is the only session detection
  # knob. Non-compactable oversized sessions route remote with guidance; the
  # gate remains only as a defensive fallback.

  # Total context size of the local model (across ALL slots). Must match the
  # per-model ctx-size in models.ini for the local model (e.g. [Qwen3]
  # ctx-size). Used to compute the
  # actual per-slot context (ctx_size / active_slots) which clamps the
  # large-context routing thresholds (LP-0MSAZXXDY005AWA1). 0 disables the
  # clamp.
  #
  # Operator supersede 2026-08-18 (LP-0MSY0SDAS0031Y7F): raised to 262144
  # (3x87.4K per-slot) per operator decision — the long-context NO-GO of
  # LP-0MSAOQTJS000FFVM / LP-0MSEGPO77005CYCQ (4x65.5K / 3x87.4K / 2x131K)
  # is superseded for this profile. Rationale: remote fallback tiers are
  # rate-limited (opencode 429s observed 2026-08-18); the runtime already
  # serves 262144 ctx and the 120 GB GPU has headroom (context ~47 GB at
  # 3x262144 q8_0).
  local_model_ctx_size: 262144
  # Session context-pressure advisory (LP-0MSDCLQ2W001LGWC; unified by
  # LP-0MTVXP7DG00613ZB AC3): the advisory fires at the single
  # `compaction_trigger_ratio` below — the legacy
  # `context_pressure_warn_ratio` knob is retired.

  # --- Session compaction config (LP-0MTG6RW3L003X122) ---
  # Proxy-side proactive session compaction at prompt-assembly time.
  # trigger_ratio: fires when est_tokens > ratio × per-slot threshold
  #   (fast: 0.70 × 258,048 = 180,634 → target ≤ 117K)
  #   (cheap: 0.70 × 83,285 = 58,300 → target ≤ 38K)
  #
  # Operator request 2026-09-17: DISABLED. 0 disables (docs/llama-router.md);
  # the proxy no longer summarises/compacts sessions. Restore 0.70 to re-enable.
  compaction_trigger_ratio: 0
  # Summariser model: dedicated small model for in-proxy summarisation.
  # LP-0MTXCQA8I0038J4X — isolates summarizer from main Qwen3 slot to
  # avoid timeout under load (the summariser gets parallel=1 in models.ini).
  summarizer_model:
    type: local
    llama_model: Qwen2.5-7B
  # Summariser context size (tokens): sufficient for short summarisation prompt
  # + middle turns; avoids unnecessary KV cache footprint.
  summarizer_ctx_size: 8192
  # Max output tokens for the summariser: concise summary budget.
  summarizer_max_tokens: 512
  # Reasoning effort for the compaction summarizer tiers (LP-0MU58PBRD004OV1I).
  # Reasoning models (Muse via opencode-go, DeepSeek) share
  # summarizer_max_tokens with their reasoning tokens; at the upstream default
  # effort (Muse: "high") they can spend the whole budget on reasoning and
  # return an empty completion, which fails compaction and forces remote-only
  # dispatch. "minimal" leaves room for the summary text. Mapped to
  # ``reasoning.effort`` for openai-responses providers. Set to null to use the
  # upstream default (not recommended for Muse).
  summarizer_reasoning_effort: minimal
  # Disable Qwen3 "thinking" for the local summarizer via the llama-server
  # chat_template_kwargs.enable_thinking flag. Harmless when the remote
  # ``compact`` chain is in use (LP-0MU58PBRD004OV1I).
  summarizer_disable_thinking: true
  # Warn-only dry-run mode (LP-0MTGBPICV003JMXI/LP-0MTGBQ01A000ZFT9):
  # advisory logging only, zero dispatch change. TRUE until the AC8
  # enforcement gate passes (experiment bar + client-side compaction
  # review); flip to false to enable live enforcement.
  compaction_dry_run: false

  # --- ctx-size / slot-count routing clamp validation (LP-0MSCABA5K0010LW2) ---
  # Startup validation that computes the effective per-slot large-context
  # routing threshold (local_model_ctx_size // slots - 4096 output headroom,
  # mirroring provider.py) for the profile's session_slot_pool_size. When
  # the threshold falls below
  # min_local_routing_threshold (default 10000), a WARNING is logged at
  # startup. A threshold this small means every realistic agent session
  # exceeds the clamp, silently bypassing ALL local traffic to remote
  # (the 2026-08-02 failure mode, LP-0MSAOJTJS000FFVM). Set to 0 to disable
  # the minimum check.
  #
  # Set min_local_routing_threshold_fatal: true to make startup FAIL (raise)
  # instead of warning when the threshold is below the minimum.
  min_local_routing_threshold: 10000
  min_local_routing_threshold_fatal: false
  llama_router_mode: true
  max_concurrent_queries: 16
  # Local dispatch lease timeout in seconds.
  # An idle session holds an inactive lease for this duration after its
  # last request completes, preventing other sessions from acquiring the
  # local backend.  The lease is released when the timeout expires,
  # allowing other sessions to use the local backend.
  #
  # local_dispatch_lease_per_token_seconds: Additional lease time (seconds)
  #   added per estimated prompt token for large-context requests, reused from
  #   llama_adaptive_timeout_per_token_seconds (0.015) if not explicitly set.
  #   This prevents mid-stream lease expiry during cache prefill.
  #   Applied to BOTH explicit and anonymous/non-explicit sessions
  #   (LP-0MSEHMMBK0062ZPI) so large anonymous prefills hold their lease for
  #   the full prefill duration instead of the base 60s.
  # local_dispatch_lease_max_seconds: Hard upper bound for the adaptive lease
  #   timeout, defaults to 1500 (same as default llama_request_timeout).
  # local_dispatch_lease_prefill_poll_seconds: During the prefill phase of an
  #   explicit-session request (dispatched, no stream data chunks yet), the proxy
  #   polls llama-server for observed prefill state and extends the dispatch
  #   lease while the request is alive: per-slot n_past / n_prompt_tokens_processed
  #   from /slots (falling back to kv_cache_tokens) when the llama.cpp build
  #   reports them, or the per-slot is_processing liveness flag when it does not
  #   (b8782 removed the numeric progress fields; LP-0MSUO5Z0K007HBSS). Very
  #   large prefills beyond the adaptive cap (1500s) keep their lease. Cadence in
  #   seconds; 0 disables progress-based extension entirely (LP-0MSE05J53004C6EL).
  # local_dispatch_lease_prefill_buffer_seconds: Safety buffer added to the lease
  #   expiry after each observed prefill progress advance. Must comfortably exceed
  #   the dispatch cleanup-loop cadence (~10s) so a refresh cannot lose to cleanup.
  #   Default 30.
  # local_dispatch_lease_chunk_refresh_buffer_seconds: Safety buffer added to the
  #   dispatch lease expiry for NON-explicit (anonymous) sessions on each data-chunk
  #   arrival during an active stream. Explicit sessions refresh on chunks with the
  #   full base lease; anonymous sessions get this dedicated buffer (default 30s) so
  #   a short base lease (15s) cannot orphan-clean a long silent generation
  #   (LP-0MSUO6HLX0089MNQ). The same buffer extends the lease when orphan cleanup
  #   verifies a session's slot is still processing on llama-server (active-stream
  #   verification, LP-0MSUO6XRP001MCB2).
  # local_dispatch_no_progress_timeout_seconds: No-progress watchdog timeout for
  #   active dispatch leases (default 180s; 0 disables). When an active lease has
  #   had no observed progress advance (``last_progress_ts`` not refreshed by
  #   prefill extension or data chunks) for longer than this, the lease is released
  #   so a wedged request cannot gate the local pool indefinitely. This breaks the
  #   post-restart wedge where sessions hold leases while the backend is
  #   "processing" but produces no output (LP-0MUCEFB8E003YVFF).
  #   NOTE (LP-0MUXQ5QL40027VZ4): the prefill-phase lease extension refreshes
  #   ``last_progress_ts`` on *liveness* (per-slot ``is_processing``) as well as on
  #   numeric progress, because the deployed llama.cpp b8782 build exposes no
  #   numeric prefill progress.
  #   NOTE (LP-0MUXTW4MD003TVIC): ``/slots`` is NOT usable as the prefill-phase
  #   signal under load — llama-server holds it for the duration of a
  #   prompt-processing batch (measured 8.7s, then >15s, versus the 1s
  #   ``STATUS_QUERY_TIMEOUT``), and a queued request's slot reports
  #   ``is_processing=False``. The extension therefore also refreshes
  #   ``last_progress_ts`` whenever the upstream request is still in flight
  #   with no error (``prefill_in_flight``), which is authoritative and does not
  #   depend on ``/slots``. Without it every prefill or queue wait longer than
  #   this timeout was released, its upstream stream cancelled, and the client
  #   retried into a full re-prefill forever. A genuinely wedged slot (no
  #   response, no chunks) is still bounded by
  #   ``local_dispatch_max_prefill_seconds`` below.
  #   NOTE (LP-0MVIQ0FJC000YLX0): the orphan-cleanup sweep now applies the SAME
  #   fail-closed rule at the point of release — an expired active lease whose
  #   ``/slots`` probe is inconclusive (timeout/error/no slot) but whose
  #   ``last_progress_ts`` is inside this timeout is EXTENDED, not orphaned
  #   (``lease_verified_active reason=recent_progress``). A busy backend is not
  #   a dead backend. Setting this to 0 disables the watchdog and therefore
  #   the fail-closed extension too (a stale expired active record is then
  #   orphan-cleaned).
  # local_dispatch_max_prefill_seconds: Hard ceiling on a single local dispatch
  #   record's lifetime (default 900s; 0 disables). A record active for longer than
  #   this is released regardless of observed progress or in-flight liveness —
  #   this is the wedge bound that pairs with the prefill extension above. Also
  #   bounds the initial first-byte wait: a local request that produces no first
  #   byte within this window is aborted server-side with a retryable 503 +
  #   Retry-After (LP-0MUCEFB8E003YVFF). Checking this ceiling is what makes the
  #   in-flight liveness signal safe (LP-0MUXTW4MD003TVIC).
  # local_dispatch_first_byte_timeout_seconds: Initial first-byte wait ceiling
  #   for a local dispatch (default 840s; 0 disables; LP-0MV6BR3HI00957PF). The
  #   default is STRICTLY BELOW the client's 900-second queue-timeout deadline so
  #   the proxy always returns a retryable 503 before the client gives up — the
  #   legacy first-byte default of 900 s (reusing the lifetime wedge knob) raced
  #   the client exactly and logged ``dispatch_first_byte_timeout ...
  #   ceiling=900s``. The lifetime wedge bound above is unchanged; a healthy
  #   stream that delivered its first byte keeps its full lifetime window.
  #   NOTE (LP-0MVIQ0G2M0006QF6): the effective ceiling is the TIGHTER of this
  #   value and ``local_prefill_deadline_seconds`` below, so by default the
  #   deadline (90 s) is the bound that fires; setting the deadline to 0
  #   restores this ceiling unchanged.
  # local_prefill_deadline_seconds: Prefill deadline — a hard backstop
  #   INDEPENDENT of ETA-estimator quality (default 90 s; 0 disables;
  #   LP-0MVIQ0G2M0006QF6 AC3). If a local dispatch has produced no first byte
  #   by this deadline, the pending upstream request is cancelled and the local
  #   dispatch aborts with the retryable 503 the first-byte ceiling already
  #   produces, so the chain detours to the next provider instead of leaving
  #   the client on a silent socket for minutes (baseline: 48 of 606 local
  #   dispatches had a first byte after >120 s, max 592 s). It is deliberately
  #   ABOVE the admission budget (``contention_queue_max_wait_seconds``, 60 s)
  #   so a request admitted inside its budget is never cut off, and BELOW the
  #   840 s wedge ceiling so it is the bound that actually fires. Precedence:
  #   deadline < first-byte ceiling < ``local_dispatch_max_prefill_seconds``.
  #   Logged as ``prefill_deadline_exceeded`` when it is what fired.
  # local_dispatch_prefill_observability_warn_seconds: Threshold (default 30s) at
  #   which a long initial first-byte wait logs a ``prefill_wait_exceeds_threshold``
  #   warning. While awaiting the SSE response headers, the proxy polls prefill
  #   progress concurrently (at ``local_dispatch_lease_prefill_poll_seconds``) so
  #   progress is observable before the first byte and the wait is visible in
  #   production (LP-0MUCEFC0T009V7ZY).
  # /slots poll coalescing (LP-0MUCEFD5B003TURT): every status poll queries
  #   llama-server ``/slots``; under N concurrent pollers that is N requests
  #   per interval. A short-TTL cache + single-flight coalescing bounds
  #   upstream volume by the TTL. Tunable via environment variables:
  #     SLOTS_POLL_TTL_SECONDS (default 1.0) — freshness window for a
  #       coalesced /slots snapshot; callers within it share one request.
  #     SLOTS_POLL_FAILURE_BACKOFF_SECONDS (default 5.0) — how long a failed
  #       /slots fetch is cached so an unavailable backend is not hammered.
  #     SLOTS_POLL_FOLLOWER_TIMEOUT_SECONDS (optional) — upper bound on how
  #       long a follower waits for the leader's shared future before it
  #       promotes itself to leader; defaults to the caller's own /slots
  #       timeout and may only lower it (LP-0MVK1YDKB0009HTM).
  #   A leader that is cancelled (e.g. the browser disconnects and Starlette
  #   cancels the SSE handler) always settles that shared future, so followers
  #   are released instead of hanging forever (LP-0MVJML600003CQ6Y).
  #   On failure callers fall back to the last-known counts with slots_stale.
  # Reduced from 180s to 60s to prevent long cross-session blocking, then
  # to 15s (LP-0MSKLI4FH0082TEB). Log analysis (5.3h, 198 local_dispatch_denied
  # events) showed 100% of denies caused by idle lease holders, never GPU
  # saturation (active>=3: 0). Inter-turn reclaim gaps: median 0.2s, p90 0.7s,
  # p95 1.6s — well under 15s. Deny-avoidance simulation: T=15 avoids ~1/3 of
  # denies (~9% model error). Prefill protection is preserved: the adaptive
  # lease (60 + tokens x 0.015, cap 1500s) and prefill-progress extension apply
  # to the in-flight request; only the post-stream cooldown (fixed base) shrinks.
  # Raised back to 30s (LP-0MSUO82NF002HUMC) as a safety net after the 15s
  # verification (LP-0MSKOHV55003XFTB) showed a 15x increase in mid-request
  # orphan cleanups; T1-T3 (prefill-progress liveness extension, anonymous
  # chunk-refresh, active-slot orphan verification) address the root causes.
  local_dispatch_lease_timeout_seconds: 30
  session_single_flight_mode: queue
  session_single_flight_max_queue_depth: 1
  # Session single-flight queue timeout (LP-0MS14PM88007NNUJ).
  # When a session has an active in-flight request and mode is "queue",
  # subsequent requests wait for this duration before being rejected.
  # Prevents stuck requests from starving subsequent requests indefinitely.
  # Default: 120 seconds.
  session_single_flight_queue_timeout_seconds: 120
  # Duplicate-retry backoff (LP-0MUCEFCV5006UKSZ). When an identical request
  # (same session + same messages hash) is already in flight, the retry is
  # rejected with a retryable 409 + Retry-After instead of queueing behind
  # (then re-prefilling) or cancelling the original prefill. This value is
  # the Retry-After hint in seconds. Default: 10.
  session_single_flight_duplicate_retry_after_seconds: 10
  # Directory for KV-cache slot snapshots written by slot save/restore
  # (llama-server prompt_save/prompt_load). Must be writable by the proxy
  # user; retention is handled by scripts/cleanup-slot-cache.sh.
  #
  # With multiple local backends (LP-0MRPILSMW004T4H8) each server stores
  # its slot snapshots in its own subdirectory derived from its endpoint:
  #   {session_slot_save_path}/{host}-{port}/slot_<session_id>.bin
  # so slot state from one server never collides with another. Single-server
  # setups (no per-provider ``endpoint``) keep using the directory directly.
  session_slot_save_path: /home/rgardler/projects/llm/slot-cache
  # Number of parallel sessions (GPU contexts) for local dispatch.
  # Controls how many concurrent Pi agent sessions can hold dispatch leases
  # and process requests through the local llama-server simultaneously.
  #
  # MUST match llama-server's --parallel / -np flag passed in start-llama.sh.
  # Mismatch causes slot exhaustion or restore failures:
  #   - pool_size < --parallel → some server slots go unused
  #   - pool_size > --parallel → sessions map to slot IDs that do not exist
  # The start script reads LLAMA_PARALLEL env var (set by lifecycle from this
  # value) to automatically keep them aligned.
  #
  # The dispatch lease system (``_try_acquire_local_dispatch``) allows up to N
  # concurrent sessions, where N = session_slot_pool_size. When a session holds
  # an active or inactive (post-request cooldown) lease, its slot is reserved.
  # Other sessions are blocked only when all N slots are occupied.
  #
  #
  # Server restart required to change this value (no hot reload).
  # Slot pool is FIXED at 2 (the N=2 verdict LP-0MV9UNGEB009XUZ5 /
  # LP-0MVCGYAI80084PCZ); bursts are absorbed by the bounded contention
  # queue below. No routing policy change ever restarts the proxy or
  # llama-server again (LP-0MVDT94F0003VHUA AC4).
  session_slot_pool_size: 2

  # -----------------------------------------------------------------------
  # Prefill serialisation (LP-0MVGDUUV3001XFRJ)
  # -----------------------------------------------------------------------
  # Maximum concurrent local PREFILLS (dispatch → first byte). Decoding in
  # other slots is unaffected — only prefill-vs-prefill is serialised (decode
  # keeps running in parallel).
  #
  # Measured 2026-10-19 → 10-20 (460 paired local dispatches): 47.8 % of
  # prefills shared the GPU with at least one other; per-request first-byte
  # p50 was 85.0 s with one overlap vs 23.4 s alone, while aggregate prefill
  # throughput stayed flat (~254 tok/s) — concurrency added latency, not
  # capacity. 1 = serialise (default); 0 = disable the gate (the cap becomes
  # the slot pool, i.e. the behaviour before this change). A malformed or
  # negative value falls back to 1.
  #
  # A request that cannot start its prefill waits in the bounded contention
  # queue above (when the policy allows) and falls back to remote exactly as
  # before when the caps are hit; the prefill-ETA admission guard refuses
  # waits that cannot succeed. Server restart required to change.
  local_max_concurrent_prefills: 1

  # -----------------------------------------------------------------------
  # Capacity-based local admission (LP-0MVGDUVS6003T2IX)
  # -----------------------------------------------------------------------
  # The economic gate is a fixed NEW-TOKEN threshold
  # (local_large_context_cold_cache_threshold: 38000) and the physical cap is
  # the per-slot clamp. Those thresholds are UNCHANGED by this feature: raising
  # them was rejected twice (LP-0MVGCOZMZ003I6PF, LP-0MVGD9YLM0055SFF) because
  # the 38k-124k band needs ~100 slot-hours per 24h when cache-cold against
  # ~26 h of measured idle headroom - it only fits with warm caches.
  #
  # Instead the economic band may be admitted locally while its projected
  # slot-seconds fit inside a share of MEASURED idle slot time:
  #   projected_s = prefill ETA (calibrated from dispatch_first_byte_ms)
  #                 + local_capacity_admission_decode_seconds
  #   budget_s    = local_capacity_admission_budget_ratio *
  #                 (slots * horizon - union(busy slot intervals in horizon))
  # The prefill-ETA admission guard (LP-0MVGDUV5E005UWBQ) and prefill
  # serialisation (LP-0MVGDUUV3001XFRJ) supply the admission control this
  # depends on.
  #
  # DEFAULT OFF. Enable only after cache warmth (LP-0MVGD9YXH008O304), the
  # prefill-ETA guard and prefill serialisation are live in the RUNNING proxy
  # and the 24h measurement (LP-0MVGHXD59008UOUD) is green.
  # Rollback: local_capacity_admission_enabled: false (read per request; no
  # llama-server restart needed).
  #
  # Achieved warm threshold: unchanged - the hard routing cap (~126,976 at
  # N=2, ctx 262144, minus output headroom). Reason: the measured cold share of
  # local dispatches in the 24h window ending 2026-10-20 11:00 is 39.4%
  # (206/523), better than the 45.7% baseline but not low enough to justify
  # widening a fixed threshold; capacity-based admission is used instead.
  local_capacity_admission_enabled: false
  local_capacity_admission_budget_ratio: 0.8
  local_capacity_admission_horizon_seconds: 3600
  local_capacity_admission_decode_seconds: 30

  # -----------------------------------------------------------------------
  # Contention queue (merged from the retired config-fast/cheap overlays)
  # -----------------------------------------------------------------------
  # The per-mode queue policy was declared by the mode overlays
  # (config-fast.yaml / config-cheap.yaml, both ``queue`` depth 8 / wait 120s;
  # unified to a single value, 60 s since LP-0MVIQ0EXV00673HO);
  # with the mode axis removed the policy is a single server-level knob.
  # Circuit: a request that finds all local slots busy QUEUES (bounded by
  # these caps) instead of immediately falling back to a paid remote
  # provider. ``medium`` priority engages the queue when the policy is
  # ``queue``; ``low`` always queues (cheap semantics); ``high`` never
  # queues (immediate remote fallback) — see proxy/proxy/priority.py.
  contention_queue_policy: queue
  contention_queue_max_wait_seconds: 60   # halved from 120 → 60 (LP-0MVIQ0EXV00673HO: 1 481 full-120-s fallbacks in 24h were wasted; 60 s is the documented optimum for this queue); Server restart required to change.
  contention_queue_max_depth: 8
  # ETA-aware admission ordering (LP-0MVIQ0G2M0006QF6 AC1). With
  # ``local_max_concurrent_prefills: 1`` one long prefill is head-of-line
  # blocking for every queued local request (1 827 prefill-saturated queue
  # samples vs 468 generating in 24h). Within each retention class the queue
  # now inserts a waiter by ascending projected prefill ETA, so a queue of
  # 20 s turns is not parked behind one 7-minute prefill. Retention still wins
  # over size: ordering never lets a newcomer overtake a retained session.
  # ``false`` restores plain FIFO within each class (rollback).
  contention_queue_eta_ordering: true
  # Starvation bound for ETA ordering: a waiter that has waited this long is
  # promoted to the front of its retention class (treated as ETA 0), so a
  # long prefill that keeps losing to shorter ones still gets the slot.
  contention_queue_eta_promotion_seconds: 30
  # Lease-owner retention priority (LP-0MVI2VRT2000V1AP). A session that
  # already holds a local lease, or was granted one within this grace window
  # AND still has local cache history, is placed ahead of non-retained
  # waiters in the contention queue (FIFO within each class). Rationale: a
  # returning session otherwise re-queues behind newcomers, waits the full
  # 60 s budget and detours to a paid provider, then comes back and
  # re-prefills — measured on 2026-10-21 as 7 local<->remote transitions in
  # 12 minutes for one session, with no ETA or context-size cause.
  # The cache-history requirement keeps the priority honest: a session whose
  # prefix was evicted is no cheaper than a newcomer and earns no priority.
  # Each reorder logs ``contention_queue_retention session=... ahead_of=...
  # reason=lease_owner_retention``. Bounds [0, session_guardrail_max_runtime_
  # seconds] (1800); the grace deliberately MAY exceed
  # ``contention_queue_max_wait_seconds`` so a returning session always
  # re-queues as retained. ``0`` disables retention (the rollback path: queue
  # order returns to plain FIFO) with no warning.
  contention_queue_lease_grace_seconds: 300

  # -----------------------------------------------------------------------
  # Prefill-ETA admission guard (LP-0MVGDUV5E005UWBQ,
  # LP-0MVIQ0F8T002FS42)
  # -----------------------------------------------------------------------
  # Before dispatching a local request the proxy costs the projected local
  # prefill from OBSERVED dispatches (dispatch_first_byte_ms, per model and
  # context bucket, rolling window) and compares it with the caller's wait
  # budget (``contention_queue_max_wait_seconds`` above; ``high`` priority
  # never queues, so it has no budget). When the prefill cannot finish inside
  # the budget the wait is a guaranteed loss — the request would park for up
  # to the full budget and then fall back remote anyway (measured 2026-10-19
  # → 10-20: 4,947 of 5,805 queued waits = 85 % abandoned) — so local
  # admission is refused immediately and the request falls through to the
  # next provider (LP-0MVIQ0EXV00673HO: halved budget from 120→60 s as 1 481
  # full-120-s waits were wasted in 24h). A request refused this way that finds no remote provider
  # receives a retryable 429 with ``Retry-After`` and ``X-Local-Admission*``
  # headers.
  #
  # The guard runs on BOTH local dispatch paths (LP-0MVIQ0F8T002FS42):
  #   - queue entry, when every local slot is busy; and
  #   - the DIRECT (free-slot) path, immediately before dispatch. A free slot
  #     is not permission to start a 40-80k-token prefill the caller will
  #     abandon — baseline 48 of 606 local dispatches had a first byte after
  #     >120 s, most of them on a free slot. The direct decision logs
  #     ``reason=eta_exceeds_budget_direct free_slot=true`` (the queue
  #     decision keeps ``reason=eta_exceeds_budget``); both use this one
  #     estimator and this one budget knob — there is no second budget.
  #
  # The comparison is OCCUPANCY-AWARE (LP-0MVICD2YW004DJPV): the quantity
  # tested against the budget is
  # ``projected_wait = eta_prefill * (busy_slots + 1)`` — the own prefill
  # repeated for the occupied gate ahead of it (``busy_slots`` = the larger of
  # the generating concurrency and ``prefills in flight``, capped at the slot
  # pool). With prefills serialised (``local_max_concurrent_prefills: 1``)
  # the in-flight prefill is always ahead of a newcomer, and ignoring it
  # admitted waits that ``/llama/local/status``'s own ``queue_eta_seconds``
  # had already flagged as unservable (2026-10-21 window: 261 of 302 queued
  # waits fell back after queueing, 215 at the full budget). The same function
  # computes ``queue_eta_seconds`` on /llama/local/status, so the published
  # estimate and the enforced verdict cannot drift. An in-flight prefill with
  # unobservable progress is charged the calibrated estimate (never "free
  # soon").
  #
  # CONSERVATIVE ETA FOR LARGE PROMPTS (LP-0MVKUKF65008D5UN). The projected
  # prefill above is costed from a conservative percentile of observed
  # first-byte times for prompts >= 32k tokens
  # (``local_admission_guard_eta_percentile``, default p75, never below the
  # bucket's measured p50), so a large prompt is not admitted on the
  # optimistic point estimate that the 90 s deadline then cancels. Set the
  # percentile to 0 for the rollback (point estimate, byte-for-byte).
  #
  # SECOND, INDEPENDENT BOUND — the prefill DEADLINE (LP-0MVKUKEU80022C3U).
  # The budget bound above only refuses when the projected wait exceeds the
  # queue budget, but nothing refused admission against the hard
  # ``local_prefill_deadline_seconds`` (default 90 s) backstop. A prompt
  # whose projected first-byte ETA >= the deadline is a guaranteed loss —
  # the dispatch is cancelled by the deadline before its first byte
  # (deterministic, measured 2026-10-23: 130-265 s prefills vs a 90 s
  # deadline). The guard therefore ALSO refuses when
  # ``eta_prefill >= local_prefill_deadline_seconds``, logging
  # ``reason=prefill_eta_exceeds_deadline`` on BOTH paths (the deadline is
  # the binding constraint — no second budget knob). Ordering to keep:
  # ``contention_queue_max_wait_seconds < local_prefill_deadline_seconds <
  # local_dispatch_first_byte_timeout_seconds <
  # local_dispatch_max_prefill_seconds`` — an admitted request must never
  # be cut off by the deadline (budget < deadline), and the deadline must
  # fire before the first-byte ceiling and the wedge bound. Setting the
  # deadline to 0 disables this bound (documented rollback).
  #
  # Fail-open: the change can only refuse further DOOMED admissions, never
  # admit more than before, and an uncalibrated bucket still admits.
  #
  #   reject  — refuse admission when the projected wait exceeds the budget
  #             (default)
  #   observe — log the decision (``local_admission_guard decision=…``) but
  #             never refuse; use to validate calibration on live traffic
  #   off     — do not evaluate the guard at all
  #
  # The guard is INERT (today's queueing behaviour, byte-for-byte) until a
  # (model, context bucket) window holds ``local_admission_guard_min_samples``
  # observations, so it can never refuse on a guess. Decisions and their
  # ETAs are counted by the proxy-usage-analysis report; each logged decision
  # carries ``eta_prefill_s``, ``eta_occupancy_s``, ``projected_wait_s``,
  # ``budget_s``, ``busy_slots`` and ``in_flight_prefills``.
  #
  # Local admission reservations + fallback intent
  # ----------------------------------------------
  # (LP-0MVIKPCSG002B0NL) A dispatcher can claim local capacity ATOMICALLY
  # before sending: ``POST /llama/local/reserve {estimated_tokens, ...}`` runs
  # the same estimator and occupancy probe as this guard (never a second ETA
  # implementation) and returns either a short-TTL single-use ticket
  # (``X-Local-Reservation: <id>`` on the follow-up dispatches without
  # re-checking or queueing) or an immediate 429 with ``reason`` /
  # ``queue_eta_s`` / ``budget_s`` / ``retry_after_s``. Tickets are default-
  # 10 s, capped at 60 s, cancellable via
  # ``DELETE /llama/local/reserve/<id>`` and pruned on expiry.
  #
  # ``X-Local-Preference: prefer-local|local-only|remote-ok`` expresses intent
  # per request: ``local-only`` returns the 429 admission response instead of
  # falling back remote (even when remotes exist); ``remote-ok`` removes the
  # local provider from the chain; unknown values and an absent header behave
  # exactly as ``prefer-local`` (today). ``high`` priority keeps its
  # never-queue semantics under every preference.
  #
  # Interaction with the queue: ``contention_queue_max_wait_seconds`` is the
  # wait budget both this guard and ``/reserve`` compare against, and
  # ``contention_queue_max_depth`` still bounds the requests that DO queue —
  # a reserved dispatch does not consume queue depth. Every response carries
  # ``X-Local-Route: local|remote|refused`` (plus ``X-Local-Fallback-Reason``
  # on remote/refused), and ``/llama/local/status`` publishes the reservation
  # counters (``reserved_issued``/``used``/``cancelled``/``expired``) so
  # reserved-but-unused tickets are observable.
  local_admission_guard_policy: reject
  local_admission_guard_min_samples: 5
  local_admission_guard_window_samples: 200
  # Prompt size used for the published estimate on /llama/local/status when
  # no dispatch has been observed yet for the current model.
  local_admission_guard_reference_tokens: 32000
  # Conservative ETA pricing for large prompts (LP-0MVKUKF65008D5UN): the
  # point least-squares estimate is optimistic for large prompts (measured
  # first-byte times p50 16s / p90 189s / max 591s; a 19,940-token prompt was
  # once modelled at 19.9s). Prompts >= 32k tokens are therefore priced at
  # this PERCENTILE of the observed ``dispatch_first_byte_ms`` window for
  # their (model, context bucket) — default 75 (p75) — and never below the
  # window's measured p50, so an infeasible large prompt is refused at
  # admission by the ``local_prefill_deadline_seconds`` backstop (C2) instead
  # of starting a prefill the deadline will cancel. Smaller prompts are
  # unchanged, and setting this to 0 disables the percentile pricing
  # (documented rollback — byte-for-byte the point estimate).
  local_admission_guard_eta_percentile: 75
  # Deadline-aware admission bound (LP-0MVKUKEU80022C3U): the guard ALSO
  # refuses local when the projected first-byte ETA exceeds this hard
  # backstop (default 90 s, same value as ``local_prefill_deadline_seconds``;
  # 0 disables the bound). See the guard documentation above for the
  # ordering: ``budget < deadline < first-byte ceiling < max prefill``.
  local_prefill_deadline_seconds: 90
  # Post-deadline prefill-thrash cooldown (LP-0MVKUKFHH005UDWL): when a
  # local dispatch is cancelled by the prefill deadline
  # (``prefill_deadline_exceeded``), that session is kept OFF local for
  # ``local_prefill_thrash_cooldown_seconds`` (default **600 s**; 0 disables)
  # so the identical prompt is not re-prefilled every turn — the 2026-10-23
  # incident re-dispatched the same 28k-124k-token prompt 41 times (35 inside
  # 02:00-03:00), each burning a full prefill before the 90 s deadline
  # cancelled it. During the window that session's local routing skips
  # (``routing_skip_local reason=prefill_thrash_cooldown``,
  # ``cooldown_remaining=Ns``) and the chain reaches the next provider
  # immediately; OTHER sessions are unaffected (per-session key). The window
  # clears early on a successful local first byte and expires lazily; this
  # knob is the documented rollback — 0 restores the pre-fix behaviour
  # (no cooldown, no skip).
  local_prefill_thrash_cooldown_seconds: 600

  # -----------------------------------------------------------------------
  # Idle-aware local admission (LP-0MVGD9Z8Z0055Y5J)
  # -----------------------------------------------------------------------
  # When the local backend has been idle for ``local_idle_admit_seconds`` and
  # nothing is queued, in flight or loading, an ECONOMIC cold/large bypass
  # (``reason=large_context_bypass``) is served locally instead of falling
  # back to a paid remote provider. The physical capacity cap
  # (``context_too_large``) is never overridden. Each admission logs
  # ``routing_idle_admit ... reason=economic_bypass_idle idle_seconds=...
  # threshold_seconds=... estimated_tokens=... session=...`` and is counted as
  # ``local_idle_admit`` by the usage report.
  #
  # MEASUREMENT WINDOW IN PROGRESS (LP-0MVJXGSEG0045IAF, approved by the
  # producer 2026-10-22): the override is ON so the >= 24 h before/after
  # measurement for LP-0MVGHXD59008UOUD can run. The window starts at the
  # `POST /admin/reload-config` that made this flag live (recorded on the work
  # item; no restart needed) and is analysed with
  # ``scripts/idle_admit_impact.py --window-closed``.
  #
  # ROLLBACK is this flag back to ``false`` + the same reload (no other state).
  # Keep it on only if the measured window supports `enable_by_default`; if the
  # tool says `tune`, apply the tuning it proposes before leaving it enabled.
  # A malformed or non-positive ``local_idle_admit_seconds`` also disables the
  # override rather than admitting on a guess.
  local_idle_admit_enabled: true
  local_idle_admit_seconds: 60

  # -----------------------------------------------------------------------
  # Expected-reuse prefix credit (LP-0MVI2XOTY008Q4UV)
  # -----------------------------------------------------------------------
  # The routing ``cached_ratio`` is measured on the PREVIOUS local response,
  # so a session's genuinely cold first turn records 0.0 and the second turn
  # used to inherit it — every turn of a growing session was costed as fully
  # cache-cold. The proxy now also records each local prompt's measured size
  # plus a fingerprint of its message list; when the incoming message list
  # extends that recorded prefix (the same prefix-match rule the slot-snapshot
  # sidecar uses), the expected reusable prefix is credited as
  # ``cached_prefix_credit_margin × min(prev_prompt_tokens, estimate)``.
  #
  # The measured ratio remains a floor (a warm measured ratio always wins),
  # a changed head or truncated history earns no credit, and a brand-new
  # session still routes cold. The margin matches the snapshot sidecar's
  # safety margin: llama.cpp may invalidate its own checkpoints on this hybrid
  # architecture, so credit less than the full recorded prompt. Set to 0.0 to
  # disable the credit and restore the previous behaviour exactly.
  cached_prefix_credit_margin: 0.9

  # -----------------------------------------------------------------------
  # Priority routing cheap window (LP-0MVDT94F0003VHUA AC1)
  # -----------------------------------------------------------------------
  # During this local-time window EVERY request is routed as ``low`` priority
  # regardless of its X-Priority header. The header value is never modified
  # and no 503/Retry-After deferral is applied — a spoofed ``high`` during
  # cheap hours simply routes as low. Defaults to the retired mode-schedule
  # cheap window (01:00–10:00). A window with start > end wraps across
  # midnight (e.g. 22:00–06:00). Set enabled: false to disable the cap.
  priority_window:
    enabled: true
    start: "01:00"
    end: "10:00"

  # -----------------------------------------------------------------------
  # Post-restart startup ramp (LP-0MU9ZXFQS0023DXT)
  # -----------------------------------------------------------------------
  # After any proxy restart (operator restart, model switch), competing
  # herdr/agent workers reconnect simultaneously, creating a thundering herd
  # that overwhelms the freshly-started proxy. This gate returns 503 + random
  # Retry-After (uniform jitter) so reconnects spread across the ramp window
  # instead of hitting the server at once. Clients simply retry with the
  # given delay. The 503 body also includes ``ramp_ends_at`` (ISO-8601 UTC,
  # the guaranteed ceiling) and ``ramp_remaining_seconds`` (whole seconds) so
  # clients can sleep for a deterministic upper bound instead of inferring
  # one from the jitter (LP-0MU9Z7O8M0053Y0K).
  startup_ramp:
    enabled: true
    # Short safety ceiling (seconds) after process start. New chat requests
    # are throttled with 503 + Retry-After only while local backends are
    # not yet ready (``backend_ready=False``).  Once backends are ready the
    # gate clears immediately regardless of elapsed time.  This value acts
    # as a hard cap so requests are never blocked indefinitely if the
    # backends fail to start.
    max_seconds: 30
    # Random jitter range for Retry-After (seconds). Each request gets a
    # random value in [jitter_min, jitter_max] to desynchronise clients.
    jitter_min: 5
    jitter_max: 15

  # -----------------------------------------------------------------------
  # Cold-start admission control (LP-0MUCEFCAT005NFNN)
  # -----------------------------------------------------------------------
  # After a restart the co-located llama-server reloads the model cold (no
  # prompt cache). Several large-context sessions dispatching at once each
  # issue a full GPU prefill concurrently; first bytes take minutes and the
  # local pool wedges. While the backend is cold, concurrent local dispatches
  # are capped (default 1) so only one large prefill runs at a time. The cap
  # lifts as soon as the first prefill completes (first data byte) — or when
  # the grace window elapses — so warm operation is unrestricted.
  #
  # local_cold_start_grace_seconds: Bounded cold window after the backend
  #   becomes ready (default 120; 0 disables cold-start admission control).
  #   Self-expiring: the cap is never permanent.
  # local_cold_start_max_concurrent: Max concurrent local dispatches while
  #   cold (default 1, minimum 1).
  # local_cold_start_retry_after_seconds: Retry-After hint for a cold-start
  #   deferral (default 15).
  #
  # Grace-period immunity (LP-0MV9UNIOZ009RIAN): while the cold window is
  # active (``is_cold()`` True), a LOCAL request that receives HTTP 503 (the
  # backend is still warming up) or a connection error is DEFERRED with the
  # Retry-After hint above — no provider_cooldown_seconds (60s) quarantine is
  # applied and the failure counter is untouched, so local recovers
  # immediately after a restart. Any other 5xx during the window, or any
  # error after the window expires, is still quarantined normally (genuine
  # faults are never masked). These knobs are unchanged; they only document
  # the deferral semantics.


  # Base slot save/restore timeout in seconds (LP-0MS91DHPZ001VWQO).
  # The effective timeout is base + session_slot_timeout_per_token_seconds x
  # estimated tokens, capped at session_slot_max_timeout_seconds (adaptive
  # scaling defined below). 3.0s covers small-context saves; larger contexts
  # get headroom from the per-token coefficient.
  session_slot_timeout_seconds: 3.0
  # --- Slot persistence safeguards (LP-0MS91DHPZ001VWQO) ---
  # Skip slot save/restore when the request context exceeds this many
  # estimated tokens. llama-server serializes the whole KV cache on save,
  # so large contexts ReadTimeout and can wedge the GPU.
  #
  # DERIVED (LP-0MTBOX45O005LD1S AC4): 0 = derive from the hard-routing cap
  # (provider.py ``compute_hard_routing_cap``) as the single source, so
  # persistence is never attempted above the routing cap (83285 static >
  # 70000 cap would persist contexts the router refuses to dispatch). The
  # derivation falls back to the per-slot routing clamp when no hard cap is
  # configured (LP-0MSEGPO77005CYCQ F3).
  session_slot_max_prompt_tokens: 0
  # Adaptive save/restore timeout: base (session_slot_timeout_seconds) +
  # per_token * estimated tokens, capped at session_slot_max_timeout_seconds.
  # 0 disables the add-on (fixed timeout only).
  #
  # F3 rebalance (LP-0MSI1RWLM007N367): coefficient 0.001 -> 0.0015 so
  # mid-size contexts get a bit more headroom; the cap stays 60s to preserve
  # the no-wedge invariant (the circuit breaker still trips within a bounded
  # window for genuinely stalled saves). The load-aware gate below is the
  # primary fix; this rebalance is belt-and-braces.
  session_slot_timeout_per_token_seconds: 0.0015
  # Upper bound on the adaptive save/restore timeout (LP-0MS91DHPZ001VWQO).
  # Prevents the adaptive window from growing unbounded on very large
  # contexts; keeps the circuit breaker within a bounded window so a wedged
  # GPU still trips and recovers instead of holding indefinitely.
  session_slot_max_timeout_seconds: 60
  # Availability-check timeout (seconds) for the pre-dispatch /slots?model=
  # query (LP-0MTDH2U6V0062TUF). The check uses a dedicated per-call client
  # with this short timeout so a slow router/child response fails fast and can
  # never exhaust the shared _http_client pool (which previously caused
  # slot_save PoolTimeouts and client-visible "Request timed out" under
  # multi-session load — LP-0MTDGBRPU003Z7KU). 2.0s is short enough to fail
  # fast under a busy child; the check is best-effort (failure -> skip).
  session_slot_availability_timeout_seconds: 2.0
  # Load-aware save/restore gating (LP-0MSI1RWLM007N367 F3): skip slot
  # save/restore when ANOTHER local session is actively streaming. llama-server
  # serializes each KV-cache copy behind its slot work, so saves issued under
  # concurrent load exceed the adaptive timeout (ReadTimeout at ~1.8% of saves
  # under load). The busy signal is proxy-side dispatch-lease state (no
  # llama-server calls); the requesting session's own lease is excluded.
  # Enabled explicitly here (the deployed config turns the gate on). Set to
  # false to disable it.
  session_slot_skip_when_busy: true
  # Circuit breaker: after this many consecutive save/restore failures for
  # a slot, stop issuing persistence calls for that slot until the cooldown
  # expires. Prevents piling doomed KV-cache copies onto a wedged GPU.
  session_slot_max_consecutive_failures: 3
  # Cooldown duration (seconds) after the circuit breaker trips for a slot.
  # Persistence resumes for the slot after this interval expires. 300s
  # (5 min) gives the GPU time to recover from a wedge before retrying.
  session_slot_failure_cooldown_seconds: 300
  slot_unavailable_retry_after: 5
  session_guardrail_max_runtime_seconds: 1800
  session_guardrail_max_completion_tokens: 16384
  session_guardrail_repetition_min_pattern_chars: 64
  session_guardrail_repetition_min_repeats: 10
  session_guardrail_invalidate_on_cutoff: true
  session_guardrail_invalidate_on_repetition: false
  # Token-rate guardrail settings (disabled by default)
  # Maximum tokens/second threshold. Set to 0 to disable token-rate guardrail.
  # Per-chunk read timeout for SSE streaming (LP-0MRB29HJ1009OR6G).
  # When the upstream stops sending data without emitting a [DONE] event
  # or closing the connection, the proxy waits this long for the next
  # chunk before synthesising a final finish_reason:stop event and ending
  # the stream.  Increased from 30 to 120 for local Qwen3 reasoning models
  # which can have long pauses during complex reasoning (LP-0MS14PM7J003XPS8).
  # Default: 120 seconds.
  stream_idle_timeout_seconds: 120

  # Upstream stall idle timeout (LP-0MRE52D3C001KP1H).
  # When the remote upstream stops sending data mid-stream without closing
  # the connection or sending a finish_reason, the proxy waits this long
  # for the next chunk before detecting a stall, closing the connection,
  # and retrying with bounded exponential backoff.
  # Must be shorter than the httpx read_timeout to fire before ReadTimeout.
  # Raised from 30s to 120s to tolerate long reasoning pauses from remote
  # reasoning models (e.g. opencode-go/deepseek-v4.1-flash on large contexts)
  # which can pause >30s between chunks while still being alive
  # (LP-0MS9FR9LG002AJ4C). Matches the local stream_idle_timeout_seconds
  # (120s) used for Qwen3 reasoning pauses (LP-0MS14PM7J003XPS8).
  # Since retries now only occur while zero content has been delivered, a
  # genuinely dead upstream fails fast once content starts flowing.
  # Raised from 120 to 240s (LP-0MSF5I7XN009ENWQ / LP-0MSF1PUM90099ZSW F4):
  # opencode-go/deepseek-v4.1-flash frequently pause >120s mid-generation while
  # still alive, so the lower bound produced false stalls (~31% of requests).
  # Trade-off: true failures are detected more slowly (up to 30s of silence).
  # Bounded by upstream_request_timeout_seconds (120s) — the idle timeout
  # never exceeds the total request timeout. See LP-0MU1RXEPL005CK97.
  # 240s (merged from the retired config-fast/cheap overlays, which both
  # set 240s; the pre-overlay base default was 30s).
  upstream_idle_timeout_seconds: 240

  # Remote-stream watchdog budgets (LP-0MSVP7ZML003XZTJ).
  # The per-chunk idle timeout above only fires on SILENCE — an upstream
  # that keeps sending keep-alives/heartbeats (or trickles empty deltas)
  # while making no content progress defeats it and can hold proxy state
  # (local_active_query, slots) for hours (observed: a pi-agent audit pane
  # held a remote deepseek stream 13+ hours). These bounded deadlines
  # terminate such "connected but idle" streams with a synthetic
  # finish_reason: error (error.type stream_max_duration /
  # stream_activity_timeout) and NO retry (restarting a stuck stream just
  # re-sticks it), and increment llama_remote_stream_terminated_total{reason}
  # so runaway streams surface as alerts (monitoring/remote_stream_alerts.yaml).
  #
  # Hard cap on total remote stream lifetime.
  # Default: 14400 seconds (4h).
  upstream_max_stream_duration_seconds: 14400
  # Max time since the last CONTENT-bearing chunk; heartbeats/empty deltas
  # do not count as progress. Default: 1800 seconds (30 min).
  upstream_activity_timeout_seconds: 1800

  # Cross-request stall circuit breaker (LP-0MRFEXXVC001RYKB).
  # Tracks stall frequency per provider within a sliding time window.
  # When the stall count exceeds the threshold within the window, the
  # provider is marked unavailable for the cooldown duration, causing
  # subsequent requests to skip directly to the next provider.
  #
  # This is Tier 3 of the retry system (complementing Tier 1 per-stream
  # retries and Tier 2 provider cooldown). All keys are optional; defaults
  # apply silently when absent.
  # Sliding window duration in seconds. Stalls older than this are ignored.
  upstream_stall_window_seconds: 300
  # Stall count threshold within window before triggering cooldown.
  upstream_stall_threshold: 3
  # Cooldown duration in seconds for providers exceeding threshold.
  upstream_stall_cooldown_seconds: 180

  # Upstream retry connection timeout (LP-0MRE8FYKV008WOTB).
  # When the proxy retries a stalled upstream connection, this timeout
  # controls how long to wait for the retry connection to be established.
  # Decoupled from upstream_idle_timeout_seconds so operators can tune
  # retry connection timeouts independently (typically shorter).
  # Default: 30 seconds.
  upstream_retry_connect_timeout_seconds: 30

  # Remote HTTP client configuration (LP-0MRE8G3JK0099Y4J).
  # Controls connection pooling and timeouts for remote upstream requests.
  # The shared pool replaces per-request httpx.AsyncClient() creation.
  remote_http_client:
    # Connection-level timeout for establishing new connections.
    connect_timeout_seconds: 30
    # Read timeout for the entire response (generous to not interfere
    # with per-request adaptive timeouts).
    read_timeout_seconds: 300
    # Maximum number of connections in the pool.
    pool_connections: 50
    # Maximum number of keepalive connections to maintain.
    pool_keepalive_connections: 10
    # Time in seconds before an idle keepalive connection is closed.
    keepalive_seconds: 60

  # Upstream retry configuration (LP-0MRE8G94H005ZBLV).
  # Controls per-stream retry behavior for remote upstream connections.
  # Aligned with Pi's default retry settings (maxRetries=3, maxRetryDelayMs=60000).
  # Note: these are per-stream retries; after they exhaust, the provider-level
  # cooldown in provider.py applies separately.
  upstream_retry_max_attempts: 3
  upstream_retry_base_delay_seconds: 2.0
  upstream_retry_max_delay_seconds: 60.0

  # Upstream request-level timeout (LP-0MRF77A0E0026B9T).
  # How long to wait for the initial HTTP response from the upstream provider.
  # Prevents 15+ minute silent hangs when the upstream is slow to respond or
  # silently returns empty content. This is different from the per-chunk idle
  # timeout (upstream_idle_timeout_seconds) which detects mid-stream stalls.
  # Default: 120 seconds.
  upstream_request_timeout_seconds: 120

  # Empty-response retry configuration (LP-0MRF77A0E0026B9T).
  # When an upstream returns a complete but semantically empty response
  # (no content, stopReason: stop, total_tokens: 0), retry with the same
  # model up to this many additional attempts before falling through to
  # the next provider in the fallback chain.
  # Default: 3 retries (3 additional attempts).
  upstream_empty_retry_max_attempts: 3
  # Base delay (in seconds) before retrying on empty response.
  # Default: 3.0 seconds.
  upstream_empty_retry_base_delay_seconds: 3.0
  # Total time budget (in seconds) for empty-response retries across all
  # attempts. Once this budget is exceeded, retries stop immediately and the
  # error is returned for fallback. This prevents infinite retry loops when
  # an upstream consistently returns empty bodies. Default: 30 seconds.
  # (LP-0MU1RXEPL005CK97)
  upstream_empty_retry_timeout_seconds: 30

  # Bounded provider retry failover budget (LP-0MU1RXEPL005CK97).
  # Hard wall-clock cap on the total time a single remote provider may spend
  # retrying stalls/empty responses (including backoff sleeps) before the
  # proxy yields a terminal finish_reason:error (error.type
  # retry_budget_exhausted) so the fallback chain fails over to the next
  # provider. Without this the per-chunk idle timeout
  # (upstream_idle_timeout_seconds, default 240s) repeats once per Tier-1
  # retry (default 4 x 240s) plus empty-response retries, so one stalled
  # gateway can sit in the request's critical path past the client's 900s
  # queue-timeout.
  # The budget applies only while ZERO content-bearing chunks have been
  # delivered; once content is flowing the stream is governed by the
  # idle/activity/max-duration budgets instead, so productive streams are
  # never cut off. Failover-budget exhaustion is logged with the configured
  # budget and elapsed time. Default: 300 seconds.
  upstream_retry_failover_budget_seconds: 300

  # Heartbeat interval (in seconds) for SSE streaming.
  # During idle periods (e.g. long pre-fill on large prompts), the proxy
  # emits {"type":"heartbeat"} events every N seconds to keep the client
  # connection alive and prevent client-side timeouts.  Default: 10.
  stream_heartbeat_interval_seconds: 10
  session_guardrail_max_token_rate: 0
  # Rolling window duration in seconds for token-rate calculation.
  # The guardrail only triggers if the rate exceeds max_token_rate for the
  # entire window duration (sustained violation, not a spike).
  session_guardrail_token_rate_window_seconds: 5
  session_require_restore_signal: false
  backend_retry_attempts: 8
  backend_retry_base_delay_seconds: 0.25
  backend_retry_max_delay_seconds: 2.0
  backend_retry_jitter_ratio: 0.25
  llama_watchdog_interval_seconds: 5
  llama_backend_probe_timeout_seconds: 2
  llama_self_heal_max_attempts: 3
  llama_self_heal_window_seconds: 300
  llama_self_heal_backoff_base_seconds: 1
  llama_self_heal_retry_after_seconds: 30
  llama_router_preload:
  - embeddings
  - code
  llama_server_bin: /home/rgardler/llama.cpp/build/bin/llama-server
  llama_server_port: 8080
  # Must be an absolute path or a script resolvable from PATH.
  # The host-based start-llama.sh is at the project root.
  llama_start_script: start-llama.sh
  llama_startup_timeout: 300
  port: 8000

  # -----------------------------------------------------------------------
  # TTS (Text-to-Speech) server configuration
  # -----------------------------------------------------------------------
  # Host and port for the qwentts.cpp TTS server.
  tts_server_host: localhost
  tts_server_port: 8081
  # Path to the tts-server binary start script.
  tts_start_script: proxy/scripts/start-qwentts.sh
  # Talker LM GGUF model path. When unset, auto-detected from qwentts.cpp/models/.
  tts_model_path: ""
  # Codec (tokenizer) GGUF model path. When unset, auto-detected from qwentts.cpp/models/.
  tts_codec_path: ""
  # Set to false to skip TTS server startup entirely.
  tts_enabled: true
  # Timeout in seconds for TTS server requests. Default: 30.
  tts_timeout_seconds: 30

  # -----------------------------------------------------------------------
  # TTS self-healing configuration
  # -----------------------------------------------------------------------
  # Maximum number of restart attempts within the time window.
  tts_self_heal_max_attempts: 3
  # Time window in seconds for counting restart attempts.
  tts_self_heal_window_seconds: 120
  # Interval in seconds between TTS health checks.
  tts_self_heal_interval_seconds: 10
  # Timeout in seconds for TTS health probe requests.
  tts_self_heal_probe_timeout_seconds: 3
