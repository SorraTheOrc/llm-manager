# ---------------------------------------------------------------------------
# Model Configuration
# ---------------------------------------------------------------------------
# Each model can define an ordered list of `providers` for automatic
# failover. The `providers` list replaces the old top-level `endpoint`,
# `api_key_env`, and `headers` fields on each model entry.
#
# Provider entry fields:
#   name        - Unique identifier for this provider entry
#   type        - "local" or "remote"
#   For remote: endpoint, api_key_env, headers (optional),
#               provider (optional, actual provider brand name used in
#                        X-Resolved-Model header; falls back to name)
#               display_name (optional, tier-aware label overriding
#                        `provider` in the X-Resolved-Model header only --
#                        e.g. `MunitoAI Free`, `OpenCode Go 3`. Keying
#                        (failure-domain, cooldown, usage-limit) still uses
#                        `provider`; LP-0MVCQ36QV009QX8K, LP-0MVDUW7OB006UT62)
#   For local:  llama_model, endpoint (optional)
#
# Local provider endpoints (LP-0MRPILSMW004T4H8):
#   Each ``type: local`` provider may declare its own ``endpoint`` URL
#   (host:port) pointing at a pre-existing llama-server instance. Multiple
#   local entries with different endpoints pool their GPU slots: the proxy
#   routes to the first local provider and falls through to the next when
#   it is busy or unhealthy (sequential fallback). Omitting ``endpoint``
#   keeps the legacy behaviour of routing to
#   ``http://localhost:{server.llama_server_port}``. Each server tracks its
#   own dispatch leases (keyed per-endpoint) and persists slot snapshots in
#   its own ``{session_slot_save_path}/{host}-{port}/`` subdirectory.
#   The proxy assumes the servers are already running (no lifecycle
#   management). Example:
#
#     models:
#       qwen3:
#         providers:
#           - name: local-qwen3-server-1
#             type: local
#             llama_model: Qwen3
#             endpoint: http://192.168.0.199:8080
#           - name: local-qwen3-server-2
#             type: local
#             llama_model: Qwen3
#             endpoint: http://192.168.0.200:8080
#
# FreeUsageLimitError cooldown (LP-0MSMCM5UG00378G8):
#   When a provider returns HTTP 429 with error.type = "FreeUsageLimitError"
#   (no explicit reset duration), the proxy marks it unavailable for a
#   per-provider cooldown: 3 hours (10800s, LP-0MRGU0I91006ODFD) applied to all
#   providers.
#
# Failure-domain grouping (LP-0MSG45I8Q0020N1F, LP-0MTVMB685003GO2F):
#   Provider entries that share the same normalized endpoint AND upstream
#   `model` form a SINGLE failure domain and are treated as one unit during
#   mid-stream re-route / fallback resolution. When one entry of a gateway
#   stalls or terminally fails, the chain skips every other entry with the
#   same model on the same endpoint for the remainder of that request,
#   hopping straight to the first entry of a different gateway or a
#   different model on the same gateway. Router endpoints (e.g.
#   https://opencode.ai/zen/go) can distinguish between different upstream
#   models — a failure for model A does not exclude model B on the same
#   gateway. Entries on different endpoints are never grouped (e.g.
#   https://opencode.ai/zen and https://opencode.ai/zen/go are distinct
#   failure domains). Local / no-endpoint entries key on the `provider` brand
#   (falling back to the entry name). Per-entry cooldowns and the ordered
#   chain are unchanged; this grouping is per-request only (cross-request
#   quarantine remains with the Tier-3 stall circuit breaker).
#
# Timed access (optional, both local and remote):
#   available_times - List of "HH:MM-HH:MM" windows (24-hour, **UTC**)
#                     during which this provider may be used. A provider
#                     whose current UTC time is outside all its windows is
#                     skipped during fallback resolution, exactly like a
#                     provider in cooldown; it becomes eligible again when a
#                     window reopens. Windows are end-exclusive and overnight
#                     ranges (e.g. "22:00-02:00") wrap past midnight.
#                     Omit the field (or use an empty list) to leave a
#                     provider unrestricted. Malformed entries are logged and
#                     ignored (fail-open). The deepseek-v4.1-flash provider
#                     (direct api.deepseek.com entry and all opencode-hosted
#                     deepseek entries: opencode-go-3-deepseek, opencode-go-2-
#                     deepseek, opencode-go-deepseek)
#                     are currently timed to off-peak UTC windows
#                     (see their entries).
#                     Example:
#                       - name: deepseek-v4.1-flash
#                         type: remote
#                         endpoint: https://api.deepseek.com
#                         api_key_env: DEEPSEEK_API_KEY
#                         model: deepseek-v4.1-flash
#                         available_times: ["10:00-12:00", "14:00-16:00"]
#
# Per-entry request budget (optional, remote providers only):
#   rate_limit_rpm - maximum dispatches to this provider entry per rolling
#                    60-second window (LP-0MVDQ1GMO00801PL). Intended for
#                    free tiers with a per-minute allowance (e.g.
#                    `munitoai-free`). New sessions may use at most
#                    `rate_limit_rpm - reserve` dispatches (reserve configured
#                    by server.provider_rate_limit_reserve_ratio) and pass
#                    through immediately when that is spent — they are never
#                    parked; a session already served by the entry may use the
#                    reserved slots and, if the window is still full, waits a
#                    bounded time (server.provider_rate_limit_wait_max_seconds,
#                    default 15) so it keeps its prompt cache. Omit the field
#                    (or use 0) to leave the entry ungated. Example:
#                      - name: some-free-tier
#                        type: remote
#                        endpoint: https://api.example.com/v1
#                        api_key_env: SOME_FREE_KEY
#                        rate_limit_rpm: 15
#
# Per-model budget knobs (optional, LP-0MVDVK5TM004TQQV):
#   The four *behaviour* knobs (reserve_ratio, wait_max_seconds, max_waiters,
#   affinity_ttl_seconds) may be tuned per fallback chain via a
#   `models.<name>.budget` block, and per provider entry via that entry's own
#   `budget` block. Precedence is ENTRY > MODEL > SERVER > built-in default, per
#   knob, so a layer sets only what it cares about and absent keys fall through.
#   Values are clamped exactly as the server knobs are (ratio to [0, 1], wait /
#   TTL / waiters to >= 0); malformed values are logged and fall back to the
#   next layer (fail open). The budget BUCKET stays keyed by provider entry — a
#   `models.plan` and `models.code` block tuning the same entry still share one
#   `rate_limit_rpm` window (one account quota); the blocks only change how each
#   chain treats that window. Example:
#     models:
#       plan:
#         budget:
#           reserve_ratio: 0.4
#           wait_max_seconds: 10
#           max_waiters: 4
#           affinity_ttl_seconds: 600
#         providers:
#           - name: some-free-tier
#             type: remote
#             endpoint: https://api.example.com/v1
#             api_key_env: SOME_FREE_KEY
#             rate_limit_rpm: 15
#             budget:            # optional per-entry behaviour override
#               reserve_ratio: 0.2
#
# Upstream rate-limit headers (optional, remote providers only):
#   respect_ratelimit_headers - when true, an HTTP 429 carrying
#                    `x-ratelimit-reset-requests` / `-tokens` /
#                    `-input-tokens` / `-output-tokens` (durations like `52s`,
#                    `1m`, `1h30m`) sets the provider cooldown to at least the
#                    reported reset plus `server.ratelimit_cooldown_margin_seconds`
#                    (default 2s), instead of only the exponential-backoff
#                    guess. Use for gateways that send no `Retry-After`
#                    (e.g. MunitoAI). On a quota 429 the reset also
#                    quarantines the failing API-key ACCOUNT (reset + the
#                    2-minute usage-limit margin) — distinct from the 2-second
#                    `ratelimit_cooldown_margin_seconds` entry margin — while
#                    same-gateway paid siblings stay eligible
#                    (LP-0MVFA1VRT007T9HT). The entry flag overrides
#                    `server.respect_ratelimit_headers`; default false so
#                    every existing provider is unchanged (LP-0MVBHDNLB007ALLJ).
#
# Responses-API mode (optional, remote providers only):
#   api - "openai-completions" (default) or "openai-responses". Some
#        upstreams (opencode.ai zen/go for the muse model family) expose
#        only the OpenAI Responses API (/v1/responses) and return HTTP 500
#        on /v1/chat/completions. Setting api: openai-responses makes the
#        proxy route the request to /v1/responses and translate between the
#        chat/completions and Responses wire formats (request bodies,
#        streaming SSE, non-streaming JSON) transparently for the client
#        (LP-0MTGK5DQO001Y8H0). omit the field for the default behavior.
#
# Example with providers list:
#   mimo-v2.5:
#     providers:
#       - name: remote-primary
#         type: remote
#         endpoint: https://api.provider-a.com/v1
#         api_key_env: PROVIDER_A_KEY
#       - name: remote-fallback
#         type: remote
#         endpoint: https://api.provider-b.com/v1
#         api_key_env: PROVIDER_B_KEY
#     aliases:
#       - mimo*
#
# Custom system prompts per model/alias:
# Each model entry may include a `system_prompt` object to configure
# a default system prompt that is injected into requests targeting
# the model or any of its aliases.
#
#   assistant-model:
#     type: local
#     aliases: ["assistant", "asst"]
#     llama_model: gemma4
#     system_prompt:
#       mode: "prepend"   # "override" or "prepend" (required)
#       file: "proxy/prompts/assistant.txt"  # path relative to repo root
#
# Prompt resolution precedence (first match wins):
#   1) Local override:   .sorraAgents/prompts/<alias>.txt
#   2) Repo default:     <system_prompt.file> resolved against repo root
#   3) No prompt if none present
#
# See proxy/MODEL_ADD.md for the full guide.
# ---------------------------------------------------------------------------

default_model: code
# default_remote is commented out: the openai provider was removed (LP-0MQNQUR7K005GDP6).
# default_remote:
#   api_key_env: OPENAI_API_KEY
#   enabled: false
#   endpoint: https://api.openai.com/v1

# Optional named provider endpoints (e.g., Tailscale based host mapping)
providers:
  Proxy:
    host: "http://100.79.231.101:8000"
    type: local

logging:
  directory: /var/log/llama-proxy
  level: INFO
  retention_days: 7
  compress_after_days: 1
  rotation_hours: 6
  # Verbose per-chunk SSE logging (LP-0MS9GAN2P002NR4M).
  # When false (default), STREAM CHUNK lines are logged at DEBUG level and
  # are not written to proxy.log at the default INFO level, cutting log
  # volume by >99% over a 24h window.
  # Set to true (or start with `--verbose` / LLAMA_PROXY_VERBOSE=1) to write
  # per-chunk SSE data to proxy.log for debugging stream issues.
  verbose_chunks: false

# ---------------------------------------------------------------------------
# Session Recording
# ---------------------------------------------------------------------------
# Records raw client-proxy-provider message payloads to disk for later
# debugging, auditing, and analysis. Recording is always-on and uses
# non-blocking file writes (asyncio background tasks).
#
# Fields:
#   path: Directory where recordings are stored.
#         Default: ~/.llm-proxy/session-recordings/ (outside the proxy tree)
session_recording:
  path: ~/.llm-proxy/session-recordings/
  # Maximum number of entries kept in the in-memory session metadata index
  # (LP-0MSNKMZCP003T8OG). Least-recently-active sessions are evicted when
  # the index exceeds this size.
  max_index_entries: 1000
  # Cold-start scan bound: after a restart, the index is rebuilt lazily from
  # at most this many most-recent session directories (by dir mtime), never
  # the full recordings tree.
  cold_scan_dir_limit: 50
  # Retention window in days (LP-0MT2TC3PB005H1RD). Recordings older than
  # this are pruned at startup and periodically while the proxy runs.
  # Values <= 0 disable pruning entirely.
  retention_days: 3
  # How often the retention prune re-runs, in seconds.
  prune_interval_seconds: 3600

# ---------------------------------------------------------------------------
# Audit model configuration
# ---------------------------------------------------------------------------
# The audit skill (skill/audit/) uses these settings to determine which
# model to call for audit operations. The resolver maps short names to
# provider-prefixed model IDs (e.g., ``deepseek-v4.1-flash`` →
# ``opencode/deepseek-v4.1-flash``).
#
# Canonical model IDs (discovered via ``pi --list-models``):
#   opencode/deepseek-v4.1-flash
#   opencode-go/deepseek-v4.1-flash
#   openrouter/deepseek/deepseek-flash
#
# See proxy/provider_resolver.py for the full mapping table.
audit_model: "deepseek-v4.1-flash"
audit_model_fallbacks:
  # Mirrors plan's paid-tier fallbacks (the opencode free zen-muse tier
  # was removed: OpenCode's free tier errors outside the OpenCode app).
  - "deepseek-v4.1-flash"

# ---------------------------------------------------------------------------
# Sourced per-entry context limits (LP-0MVF9N31A0006VH5)
# ---------------------------------------------------------------------------
# Each remote provider entry below declares ``max_context_tokens``: the
# maximum estimated prompt context (the routing estimate) the entry may
# serve. A request estimated above that ceiling SKIPS the entry and falls
# through to the next eligible provider — a size mismatch, not a failure
# (no cooldown, affinity, usage-limit reset or contention-queue entry); the
# gate itself is LP-0MVF9N2QL001CDA7. Absent / ``0`` = ungated.
#
# Every shipped value is SOURCED, never guessed, and was probed on
# 2026-10-19:
#
#   munitoai-free   150000   The free tier's documented rolling-60s
#                            input-token allowance, read from the
#                            ``x-ratelimit-limit-input-tokens`` response
#                            header. The upstream model window
#                            (deepseek-ai/deepseek-v4-flash, 1,048,576) is
#                            far larger, so the ALLOWANCE is the binding
#                            ceiling: one dispatch can consume at most one
#                            full minute of the free tier's input budget,
#                            and a larger prompt spills to the paid tiers
#                            instead of spending the whole window on one
#                            request.
#   munitoai        400000   The paid tier's rolling-60s input-token
#                            allowance (``x-ratelimit-limit-input-tokens``).
#                            Same upstream model as the free tier, but a
#                            much larger allowance, hence the deliberate
#                            difference from munitoai-free.
#   opencode-go     1000000  Model registry context window for
#   opencode-go-2            opencode-go/deepseek-v4.1-flash. OpenCode Go
#   opencode-go-3            reports plan quota as rolling/weekly/monthly
#                            PERCENTAGES (``/v1/usage``), not a per-minute
#                            token allowance, so the upstream context window
#                            is the only sourceable ceiling. Identical
#                            upstream model on all three entries → identical
#                            limit.
#   deepseek-flash  1048576  ``GET https://api.deepseek.com/models/
#                            deepseek-flash`` → ``context_window``. This is
#                            the LARGEST window in the chain, so the final
#                            tier stays effectively ungated: an oversized
#                            prompt always has a destination and the chain
#                            cannot exhaust because of caps alone (AC3).
#   compact chain   1048576  opencode-go/muse-spark-1.3-contributor (model
#                            registry) and api.deepseek.com deepseek-flash
#                            windows; the summariser prompt is small, so
#                            these are documentation-consistency caps.
#
# Deliberately NOT gated (no single sourceable ceiling): ``github-primary``
# declares no ``model`` — the client chooses the upstream model — so a
# per-entry context limit cannot be sourced for it. The local entries are
# already bounded by the local routing thresholds
# (local_large_context_*_threshold, local_model_ctx_size, hard routing cap).

models:
  # Multi-backend local providers (LP-0MRPILSMW004T4H8): a ``type: local``
  # provider may declare an optional ``endpoint`` (full ``http://host:port``
  # URL of a specific llama-server instance) to run several local servers
  # behind one model with per-endpoint fallback, slot persistence
  # (``{host}-{port}/`` subdirs) and dispatch leases. Omitted ``endpoint``
  # keeps the legacy single-server default
  # ``http://localhost:{llama_server_port}``. See proxy/MODEL_ADD.md.
  embed:
    providers:
      - name: local-embed
        type: local
        llama_model: mxbai-embed
    aliases:
    - embeddings
    - embed
  github:
    providers:
      - name: github-primary
        type: remote
        provider: github
        endpoint: https://models.inference.ai.azure.com
    aliases:
    - github-*
  # Private model: local-only, no remote fallback at all.
  # Uses the Qwen3 llama_model. When the local slot is busy the request
  # is queued / deferred — it never falls through to a paid provider.
  private:
    providers:
      - name: local-qwen3
        type: local
        llama_model: Qwen3
    aliases:
    - private
    force_full_prompt: true
    tokenizer: qwen3
  # Cascading fallback: local Qwen3 first, then MunitoAI, then OpenCode Go,
  # OpenCode Go #2, then DeepSeek direct.
  # Slot exhaustion on the local model falls through to remote tiers.
  # Requires OPENCODE_API_KEY and DEEPSEEK_API_KEY env vars (or pi auth.json fallback).
  #
  # Per-model budget tuning (LP-0MVDVK5TM004TQQV) — all keys optional, absent
  # keys fall through to server.* then the built-in default:
  #   budget:
  #     reserve_ratio: 0.4        # share of rate_limit_rpm kept for sessions
  #                               # already using the entry (server: 0.3)
  #     wait_max_seconds: 10      # per-request wait cap for those sessions
  #                               # (server: 15; 0 never waits)
  #     max_waiters: 4            # concurrent waiter cap (server: 8)
  #     affinity_ttl_seconds: 600 # how long a session counts as in progress
  #                               # (server: 900)
  # The bucket stays per provider entry, so plan/author/code tuning the same
  # entry share one rate_limit_rpm window — only the behaviour differs.
  plan:
    providers:
      - name: local-qwen3
        type: local
        llama_model: Qwen3
      # MunitoAI Free (LP-0MV5UPXKL002MSKB): free-tier remote fallback, sits
      # immediately after local. Uses a separate key resolved from
      # ~/.pi/agent/auth.json under either ``munitoai_free`` or the
      # documented hyphenated ``munitoai-free`` — the resolver strips
      # _API_KEY from MUNITOAI_FREE_API_KEY and tries both the underscore
      # and hyphenated stems (LP-0MVBJXZY5002UW10). No ``available_times``
      # window — eligible around the clock.
      # ``display_name`` marks the free tier so X-Resolved-Model shows
      # ``MunitoAI Free/<model>`` vs the paid ``MunitoAI/<model>`` in Pi
      # (LP-0MVCQ36QV009QX8K).
      - name: munitoai-free
        # Honour MunitoAI's x-ratelimit-reset-* headers on 429
        # (LP-0MVBHDNLB007ALLJ): no Retry-After is sent, so without
        # this the proxy re-probes the endpoint during exhaustion.
        # On a quota 429 the parsed reset also quarantines the failing
        # API-key ACCOUNT for reset + the 2-minute usage-limit margin
        # (_USAGE_LIMIT_RESET_MARGIN_SECONDS), in addition to this entry's
        # cooldown of reset + the 2-second ratelimit_cooldown_margin_seconds;
        # the account key is api_key_env@endpoint:model, so same-gateway
        # paid siblings stay eligible (LP-0MVFA1VRT007T9HT).
        respect_ratelimit_headers: true
        display_name: MunitoAI Free
        type: remote
        provider: MunitoAI
        endpoint: https://api.munito.ai/inference
        api_key_env: MUNITOAI_FREE_API_KEY
        forward_session_headers: false
        model: deepseek-ai/deepseek-v4-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): MunitoAI free-tier
        # x-ratelimit-limit-input-tokens=150000 per rolling 60s
        # (probed 2026-10-19; see the sourced-limits block above).
        max_context_tokens: 150000
        # Free-tier request budget (LP-0MVDQ1GMO00801PL): the free tier allows
        # only a small number of requests per rolling 60s window, so the proxy
        # dispatches to it only while that window has capacity. Over-budget
        # requests from NEW sessions pass straight through to the next tier
        # (never parked); a session already served by this entry waits a
        # bounded time for the window to reset, preserving its prompt cache.
        # Tune per chain with `models.<name>.budget` or per entry with this
        # entry's own `budget` block (LP-0MVDVK5TM004TQQV); otherwise the
        # server.provider_rate_limit_wait_* / provider_affinity_ttl_* defaults
        # apply.
        # Deliberately conservative at 3/min (LP-0MVF19DKR008VCHO): the free
        # tier is a bonus tier, so bursts spill to the paid tiers instead.
        # floor(3 x 0.3) = 0 reserve slots, so new and in-progress sessions
        # both see the full 3-per-window cap.
        rate_limit_rpm: 3
      - name: opencode-go-3
        display_name: OpenCode Go 3
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_3_API_KEY
        forward_session_headers: false
        #
        # Deepseek
        #
        # IMPORTANT: deepseek-flash via api.deepseek.com has available_times
        # windows that leave gaps (UTC 01:00-04:00 and 06:00-10:00). During
        # these gaps the provider is skipped and requests fall to the next
        # available provider (or enter chain-hold retry). The 10:00-00:00
        # window covers 14 hours; the 3+2 hour gaps are accepted risk.
        # (LP-0MU1RXEPL005CK97)
        #
        model: deepseek-v4.1-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): model registry
        # context window for opencode-go/deepseek-v4.1-flash = 1000000
        # (OpenCode Go publishes no per-minute token allowance).
        max_context_tokens: 1000000
        available_times: ["00:00-01:00", "04:00-06:00", "10:00-00:00"]
        #
        # Muse
        #
        # model: muse-spark-1.3-contributor
        # api: openai-responses
      - name: opencode-go-2
        display_name: OpenCode Go 2
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_2_API_KEY
        forward_session_headers: false
        #
        # Deepseek
        #
        model: deepseek-v4.1-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): model registry
        # context window for opencode-go/deepseek-v4.1-flash = 1000000
        # (OpenCode Go publishes no per-minute token allowance).
        max_context_tokens: 1000000
        available_times: ["00:00-01:00", "04:00-06:00", "10:00-00:00"]
        #
        # Muse
        #
        # model: muse-spark-1.3-contributor
        # api: openai-responses
      - name: opencode-go
        display_name: OpenCode Go
        type: remote
        provider: opencode-go
        endpoint: https://opencode.ai/zen/go
        api_key_env: OPENCODE_API_KEY
        forward_session_headers: false
        #
        # Deepseek
        #
        model: deepseek-v4.1-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): model registry
        # context window for opencode-go/deepseek-v4.1-flash = 1000000
        # (OpenCode Go publishes no per-minute token allowance).
        max_context_tokens: 1000000
        available_times: ["00:00-01:00", "04:00-06:00", "10:00-00:00"]
        #
        # Muse
        #
        # model: muse-spark-1.3-contributor
        # api: openai-responses
      # MunitoAI (LP-0MV5UPXKL002MSKB, LP-0MV6ENYYH006XX0Z): fallback tier
      # after the opencode-go chain. It declares no available_times window,
      # so it is eligible around the clock. The API key is resolved from
      # ~/.pi/agent/auth.json (key ``munitoai``).
      - name: munitoai
        # Honour MunitoAI's x-ratelimit-reset-* headers on 429
        # (LP-0MVBHDNLB007ALLJ): no Retry-After is sent, so without
        # this the proxy re-probes the endpoint during exhaustion.
        # On a quota 429 the parsed reset also quarantines the failing
        # API-key ACCOUNT for reset + the 2-minute usage-limit margin
        # (_USAGE_LIMIT_RESET_MARGIN_SECONDS), in addition to this entry's
        # cooldown of reset + the 2-second ratelimit_cooldown_margin_seconds;
        # the account key is api_key_env@endpoint:model, so same-gateway
        # paid siblings stay eligible (LP-0MVFA1VRT007T9HT).
        respect_ratelimit_headers: true
        type: remote
        provider: MunitoAI
        endpoint: https://api.munito.ai/inference
        api_key_env: MUNITOAI_API_KEY
        forward_session_headers: false
        model: deepseek-ai/deepseek-v4-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): MunitoAI paid-tier
        # x-ratelimit-limit-input-tokens=400000 per rolling 60s
        # (probed 2026-10-19; see the sourced-limits block above).
        max_context_tokens: 400000
      - name: deepseek-flash
        type: remote
        provider: deepseek
        endpoint: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        model: deepseek-flash
        # Context ceiling (LP-0MVF9N31A0006VH5): api.deepseek.com
        # GET /models/deepseek-flash context_window = 1048576 — the
        # LARGEST window in the chain, so the final tier stays
        # effectively ungated and oversized prompts always have a
        # destination (AC3).
        max_context_tokens: 1048576
        available_times: ["00:00-01:00", "04:00-06:00", "10:00-00:00"]
    # Per-priority provider chains (LP-0MVDT94F0003VHUA AC2). Each entry is
