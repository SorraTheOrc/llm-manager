# GPU compute utilisation derived from power draw
#
# WHY NOT gpu_busy_percent
# -----------------------
# On this host (Strix Halo APU, Radeon 8060S iGPU, gfx1151) the driver's busy
# counter is a two-state detector, not a percentage: its step sits at ~30 W, so
# it reads 1-10% below 30 W and 92-99% from 30 W upward. The step is BELOW the
# idle-with-display band (p50 45 W), so idle-with-context and computing both
# read ~99% and the counter INVERTS across exactly the band that matters.
# Re-measured 2026-11-06 on kernel 7.0.0-38-generic over the whole post-boot
# window (2026-10-31 14:28 -> 2026-11-06 14:28 UTC, 25463 observed 15 s
# samples): 99.2% mean busy at 40-60 W (GPU idle with an active display)
# against 98.7% at 90-100 W (computing); 7.9% false-busy (busy >= 90% while
# power < 40 W) and 1.7% false-idle (busy < 90% while power >= 90 W), so it
# also under-reports slightly. The 20 W latch claim this comment used
# to carry is retired: measured on the same recipe, the step was already at
# ~30 W before the 2026-10-31 reboot (20-30 W read 10.2%), and that claim
# invited the conclusion that the counter is fixed.
#
# The full measurement, the pre-reboot comparison column and the PromQL recipe
# that recomputes every band live in monitoring/README.md, "Why not amd-smi,
# rocm-smi or amdtop?" (canonical statement; cross-referenced, not restated).
# Earlier evidence (2026-07-31, LP-0MS9GA6QL007XTBP, "False-positive guard" in
# proxy/proxy/backends/llama.py and the llama_gpu_wedge_* block in
# proxy/config.yaml) recorded 30/30 samples at 100 while power showed the GPU
# idle (~54 W) and computing (~115 W); the measured step explains that same
# symptom with a threshold rather than a stuck counter. gpu_busy_percent is NOT
# a utilisation signal here and must not be used in any rule; the proxy's own
# wedge detector had to be disabled because of it. It is also no longer
# published: the 10 s sysfs sampler stopped reading the attribute on 2026-11-07
# (LP-0MW5K8ZDZ007YSIX), so the series exists only as history inside the
# retention window. `amd-smi` is not an
# alternative either: it reports N/A for usage/power/clocks/energy on this APU,
# and `amdtop`/`rocm-smi` surface this same counter (LP-0MVSQQO910077LYL,
# LP-0MW5K7WKZ005VJXA).
#
# WHAT IS USED INSTEAD
# --------------------
# Power draw is the discriminating signal on this hardware:
#
#   idle      ~40-54 W
#   computing ~115 W
#   threshold  90 W  == server.llama_gpu_wedge_power_low_threshold_watts
#                      (proxy/config.yaml), reused here so the two layers agree
#
# Series source: node_exporter's hwmon collector. 'PPT' (package power) is the
# GPU power sensor; the amdgpu device is selected by joining
# node_hwmon_chip_names on chip_name="amdgpu" rather than by a host-specific
# chip id, so the rule works on any node_exporter target exposing an AMD GPU.
#
# OUR WORK VS ANY WORK
# --------------------
# Two definitions live here, deliberately:
#
#   gpu:computing:bool            power >= 90 W            (any GPU consumer)
#   gpu:computing_workload:bool    power >= 90 W AND >= 1 busy llama slot
#                                                          (our local model's
#                                                           work)
#
# Power alone cannot tell our streams from another process drawing the GPU, so
# the combined rule is the one definition of "the GPU is doing our local model's
# work" shared by the CLI, the alerts and ad-hoc PromQL. The power-only series is
# kept unchanged so the two definitions can be compared side by side ("how much
# compute power did we own?").
#
# THE JOIN TRAP: the two inputs come from DIFFERENT scrape jobs. The power series
# carries instance="localhost:9100" (node_exporter, job="node-exporter") and
# llama_slots_busy carries instance="localhost:8000" (the llama-proxy). A naive
# `and` / `on(instance)` join matches NOTHING and the rule silently yields no
# series at all — which reads as "unknown" forever, or as "never computing" in a
# dashboard. The join is therefore label-agnostic (`on()`), and the slot side is
# reduced to a single `>= bool 1` flag so the recorded series keeps the power
# series' labels (instance="localhost:9100", job="node-exporter").
#
# GAP BEHAVIOUR: when llama_slots_busy is absent (sampler down, proxy down) or
# the power series is absent (node_exporter down) the combined rule records NO
# SERIES — never 0. Absence is "unknown"; 0 means "idle". Collapsing the two
# would make an unsampled window look like idle time and quietly understate (or
# overstate) utilisation. Consumers must treat a missing series as unknown, not
# as zero.
#
# QUERIES THESE RULES ENABLE
# --------------------------
#   avg_over_time(gpu:computing:bool[2h])      computing-time fraction (0..1)
#   gpu:power_watts:avg5m                      smoothed power for dashboards
#   sum_over_time(gpu:computing:bool[24h:15s]) * 15   computing seconds
#   avg_over_time(gpu:computing_workload:bool[2h])    share of time the GPU was
#                                                     doing OUR work (0..1, and
#                                                     absent => unknown)
#
# Validation: `promtool check rules monitoring/gpu_compute_rules.yaml` and the
# behavioural unit tests in monitoring/tests/gpu_rules_test.yml
# (`promtool test rules`), which assert the threshold, the 0/1 semantics and the
# 15-minute alert duration against synthetic power series.
#
# LP-0MVO8DOHP008FL48 (GPU utilisation must come from power).

groups:
  - name: gpu-compute.rules
    rules:
      # GPU package power in watts, restricted to the amdgpu hwmon device.
      - record: gpu:power_watts:amdgpu
        expr: |
          node_hwmon_power_average_watt
            * on (chip, instance) group_left (chip_name)
              node_hwmon_chip_names{chip_name="amdgpu"}

      # 1 while the GPU is drawing compute-level power, 0 while it is idle.
      # `bool` is required: without it the comparison would filter series
      # instead of yielding 0/1, and the averaging queries below would silently
      # drop idle samples (overstating utilisation).
      - record: gpu:computing:bool
        expr: gpu:power_watts:amdgpu >= bool 90

      # 1 while the GPU is drawing compute-level power AND at least one
      # llama-server slot is processing — i.e. the GPU is doing OUR local
      # model's work, not just some other consumer's work.
      #
      # `on()` (empty label set) is required: the power series comes from the
      # node-exporter job (instance="localhost:9100") and llama_slots_busy from
      # the llama-proxy job (instance="localhost:8000"), so matching on any
      # label — including the default full label set — would join nothing and
      # record no series at all. `group_left()` keeps that explicit and leaves
      # the recorded series carrying the power series' labels.
      #
      # `>= bool 1` on the slot side turns the busy count into 0/1 without
      # dropping it: without `bool`, the comparison would filter instead of
      # yielding 0, and a 0 busy-slot sample would make the multiplication
      # produce no series rather than 0 (turning "idle" into "unknown"). When
      # llama_slots_busy is absent the whole expression yields nothing, which is
      # the intended "unknown" — never 0.
      - record: gpu:computing_workload:bool
        expr: |
          gpu:computing:bool
            * on() group_left()
              (llama_slots_busy >= bool 1)

      # Smoothed power for dashboards/trend graphs.
      - record: gpu:power_watts:avg5m
        expr: avg_over_time(gpu:power_watts:amdgpu[5m])

      # Sustained compute episode. Local streams are short on this host (median
      # decode 2.4 s, p90 8 s, worst observed prefill 108 s in the 2026-10-25
      # 17:00-19:00 window), so a quarter of an hour of unbroken compute-level
      # power is abnormal and worth a look: a runaway generation loop, a wedged
      # llama-server that keeps kernels alive, or a batch job competing for the
      # GPU. Fires on the power-derived series, never on gpu_busy_percent.
      - alert: GpuComputingSustained
        expr: gpu:computing:bool == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU has been computing continuously for 15 minutes"
          description: "GPU package power on {{ $labels.instance }} ({{ $labels.chip_name }}) has stayed at or above the 90 W compute threshold for more than 15 minutes. That is far longer than any normal local stream (p90 decode 8 s; worst prefill 108 s), so check for a runaway generation loop, a wedged llama-server still holding kernels, or another process competing for the GPU. See gpu:power_watts:avg5m for the current draw."
